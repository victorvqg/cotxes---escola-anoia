<body>
<div class="tel">
  <header class="banda">
    <div><h1>Cotxes · Escola Anoia</h1><div class="sub">Montbui → Escola Anoia</div></div>
    <div class="chip-estat" id="estat">—</div>
  </header>
  <div class="zebra"></div>
  <main class="cos"><div class="avis" id="avis"></div><div id="pantalla"></div>
  <div id="full-horari" class="fullh ocult"></div>
  <footer class="credit">creat per Víctor Quintana<br><span class="versio">versió 2.28</span><div id="peu-stats" class="peu-stats"></div></footer></main>
  <div class="barra amaga" id="barra"><div id="barra-avis" class="barra-avis ocult"></div><div class="barra-int">
    <span class="barra-txt" id="barra-txt">Canvis sense desar</span>
    <button class="boto" id="btn-desa" onclick="desa()">Desa els canvis</button>
  </div></div>
</div>
<script>
/*JS-INICI*/
"use strict";

/* ── CONFIGURACIÓ: canvia aquestes 4 línies ── */
const CONFIG = {
  OWNER: "victorvqg",     // el teu usuari o organització de GitHub
  REPO_DADES: "cotxes---escola-anoia-DADES",  // repositori PRIVAT amb el fitxer de dades
  FITXER: "dades.json",              // nom del fitxer de dades dins el repo
  BRANCA: "main"                     // branca on viu el fitxer
};

const DIES = ["dl","dt","dc","dj","dv"];
const DIES_LBL = {dl:"Dl",dt:"Dt",dc:"Dc",dj:"Dj",dv:"Dv"};
const DIES_NOM = {dl:"Dilluns",dt:"Dimarts",dc:"Dimecres",dj:"Dijous",dv:"Divendres"};
const FRANGES = [
  {id:"e8", hora:"8.00", tipus:"Entrada"},
  {id:"e9", hora:"9.00", tipus:"Entrada"},
  {id:"r13",hora:"13.00",tipus:"Recollida"},
  {id:"e15",hora:"15.00",tipus:"Entrada"},
  {id:"r17",hora:"17.00",tipus:"Recollida"}
];

/* ── Estat ── */
let token = lsGet("cx_token");
let famId = lsGet("cx_fam");
var doc = null, sha = null;
let pinzell = "cotxe", dirty = false;
let esAdmin = lsGet("cx_admin") === "1";
let esStaff = lsGet("cx_staff") === "1";
let confObert = false;
let usuariId = lsGet("cx_usuari");
if (!usuariId){ usuariId = Math.random().toString(36).slice(2, 10); lsSet("cx_usuari", usuariId); }
let diaSel = (d => d>=1 && d<=5 ? DIES[d-1] : "dl")(new Date().getDay());
let tabAct = "graella";
let ultimToc = {k:"", t:0};

function lsGet(k){ try{ return localStorage.getItem(k) || ""; }catch(e){ return ""; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function slug(n){ return n.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }

/* ── Base64 amb accents (UTF-8) ── */
function b64enc(str){
  const b = new TextEncoder().encode(str); let s = "";
  for (let i=0;i<b.length;i++) s += String.fromCharCode(b[i]);
  return btoa(s);
}
function b64dec(b64){
  const bin = atob(b64.replace(/\s/g,""));
  const b = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}

/* ── GitHub com a base de dades ── */
const API = () => "https://api.github.com/repos/" + CONFIG.OWNER + "/" + CONFIG.REPO_DADES + "/contents/" + CONFIG.FITXER;
const caps = () => ({ "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" });

async function ghGet(){
  const r = await fetch(API() + "?ref=" + CONFIG.BRANCA + "&t=" + Date.now(), { headers: caps() });
  if (r.status === 401 || r.status === 403) throw { tipus: "clau" };
  if (r.status === 404) throw { tipus: "no-trobat" };
  if (!r.ok) throw { tipus: "xarxa" };
  const j = await r.json();
  return { doc: JSON.parse(b64dec(j.content)), sha: j.sha };
}

async function ghPut(missatge, intent){
  intent = intent || 0;
  doc.actualitzat = new Date().toISOString();
  const cos = { message: missatge, branch: CONFIG.BRANCA, sha: sha, content: b64enc(JSON.stringify(doc, null, 2)) };
  const r = await fetch(API(), { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, caps()), body: JSON.stringify(cos) });
  if ((r.status === 409 || r.status === 422) && intent < 3){
    // Algú ha desat abans que tu: agafa la versió nova i torna a posar-hi NOMÉS la teva família
    const fresc = await ghGet();
    const meva = doc.families.find(f => f.id === famId) || null;
    const pinLocal = doc.adminPin;
    const staffLocal = doc.staffPin;
    const idx = fresc.doc.families.findIndex(f => f.id === famId);
    if (meva){ if (idx >= 0) fresc.doc.families[idx] = meva; else fresc.doc.families.push(meva); }
    else if (idx >= 0) fresc.doc.families.splice(idx, 1);
    doc = fresc.doc; sha = fresc.sha;
    if (pinLocal && !doc.adminPin) doc.adminPin = pinLocal;
    if (staffLocal && !doc.staffPin) doc.staffPin = staffLocal;
    return ghPut(missatge, intent + 1);
  }
  if (!r.ok) throw { tipus: "desar" };
  const j = await r.json(); sha = j.content.sha;
  return true;
}

/* ── Utilitats de marques ── */
function te(m, slot, dia){ return !!(m && m[slot] && m[slot].indexOf(dia) >= 0); }
function posa(m, slot, dia){ if (!m[slot]) m[slot] = []; if (m[slot].indexOf(dia) < 0) m[slot].push(dia); }
function treu(m, slot, dia){ if (m && m[slot]) m[slot] = m[slot].filter(d => d !== dia); }
function commuta(m, slot, dia){ if (te(m, slot, dia)) treu(m, slot, dia); else posa(m, slot, dia); }
function lameva(){ return doc ? doc.families.find(f => f.id === famId) : null; }
function famOrd(){ return doc.families.slice().sort((a,b) => a.nom.localeCompare(b.nom, "ca")); }

function portaValids(f, slot, dia){
  const refs = (f.porta && f.porta[slot + "-" + dia]) || [];
  return refs.filter(r => {
    const ff = doc.families.find(x => x.id === r.fam);
    if (!ff) return false;
    const nn = (ff.nens || []).find(x => x.id === r.nen);
    return !!nn && te(nn.marca, slot, dia) && !te(ff.cotxe, slot, dia);
  });
}
function elPorta(famId, nenId, slot, dia){
  return doc.families.find(fc => te(fc.cotxe, slot, dia) &&
    portaValids(fc, slot, dia).some(r => r.fam === famId && r.nen === nenId)) || null;
}
function normalitzaRols(){
  if (!doc) return;
  if (doc.adminPin && !doc.adminFam) doc.adminFam = "quintana-andrevi";
  (doc.families || []).forEach(x => {
    if (doc.adminFam && x.id === doc.adminFam) x.rol = "admin";
    else if (x.rol === "admin") x.rol = "usuari";
  });
}
function respon(f, slot, dia){ return te(f.cotxe, slot, dia) || te(f.propi, slot, dia) || (f.nens || []).some(n => te(n.marca, slot, dia)); }
function perfilComplet(f){ return !!(f && f.nom && (f.cognomPare || "").trim() && (f.cognomMare || "").trim() && (f.conductor || "").trim() && f.nens && f.nens.length); }
function celesPendents(f){
  const p = [];
  DIES.forEach(d => {
    if (!respon(f, "e8", d) && !respon(f, "e9", d)) p.push(DIES_NOM[d] + " entrada (8.00 o 9.00)");
    ["r13", "e15", "r17"].forEach(s => { if (!respon(f, s, d)){ const fr = FRANGES.find(x => x.id === s); p.push(DIES_NOM[d] + " " + fr.hora); } });
  });
  return p;
}
function graellaCompleta(f){ return celesPendents(f).length === 0; }
function potCal(){ const f = lameva(); return esAdmin || esStaff || (f && perfilComplet(f) && graellaCompleta(f)); }

function fotoAssig(){
  const f = lameva(); const m = {};
  if (!f) return m;
  (f.nens || []).forEach(n => FRANGES.forEach(fr => DIES.forEach(d => {
    if (te(n.marca, fr.id, d)){ const c = elPorta(f.id, n.id, fr.id, d); m[n.id + "|" + fr.id + "|" + d] = c ? c.id : ""; }
  })));
  return m;
}
function detectaAvisos(){
  const f = lameva(); if (!f) return;
  const clau = "cx_vist_" + f.id;
  const ara = fotoAssig();
  const abansRaw = lsGet(clau);
  if (abansRaw){
    let abans = {}; try { abans = JSON.parse(abansRaw) || {}; } catch(e){}
    const nomDe = id => { const n = (f.nens || []).find(x => x.id === id); return n ? n.nom.trim().split(/\s+/)[0] : id; };
    const et = k => { const t = k.split("|"); const fr = FRANGES.find(x => x.id === t[1]); return nomDe(t[0]) + " \u00b7 " + DIES_NOM[t[2]] + " " + (fr ? fr.hora : t[1]); };
    const nous = [];
    Object.keys(ara).forEach(k => {
      const v = ara[k], o = abans[k] || "";
      if (v && v !== o){ const c = doc.families.find(x => x.id === v); nous.push("\ud83d\ude97 " + et(k) + " \u2192 el porta " + (c ? nomConductor(c) : "un cotxe del grup")); }
      else if (!v && o){ const c = doc.families.find(x => x.id === o); nous.push("\u23f3 " + et(k) + " \u2192 ja no t\u00e9 cotxe" + (c ? " (abans " + nomConductor(c) + ")" : "")); }
    });
    if (nous.length){
      let reg = []; try { reg = JSON.parse(lsGet("cx_avisos_" + f.id) || "[]"); } catch(e){}
      nous.forEach(t => reg.unshift({ t: Date.now(), m: t }));
      lsSet("cx_avisos_" + f.id, JSON.stringify(reg.slice(0, 50)));
    }
  }
  lsSet(clau, JSON.stringify(ara));
}
function avisosMeus(){ const f = lameva(); if (!f) return []; try { return JSON.parse(lsGet("cx_avisos_" + f.id) || "[]"); } catch(e){ return []; } }
function avisosNous(){ const f = lameva(); if (!f) return 0; const dar = parseInt(lsGet("cx_avisos_vist_" + f.id) || "0", 10); return avisosMeus().filter(a => a.t > dar).length; }

function nomConductor(f){
  if (!f) return "";
  const inis = f.nom.trim().split(/\s+/).map(p => p[0].toUpperCase()).slice(0, 2).join("");
  if (f.conductor && f.conductor.trim()){
    return f.conductor.trim().split(/\s+/)[0] + " " + inis;
  }
  return f.nom;
}
function balanc(slot, dia){
  const conds = doc.families.filter(f => te(f.cotxe, slot, dia));
  const propis = doc.families.filter(f => te(f.propi, slot, dia));
  const places = conds.reduce((s,f) => s + (f.places || 0), 0);
  const nens = [];
  doc.families.forEach(f => {
    if (te(f.cotxe, slot, dia) || te(f.propi, slot, dia)) return; // coberts per la mateixa família
    (f.nens || []).forEach(n => {
      if (!te(n.marca, slot, dia)) return;
      const c = elPorta(f.id, n.id, slot, dia);
      nens.push({ nom: n.nom, fam: f.nom, famId: f.id, nenId: n.id, portadaPer: c ? nomConductor(c) : null, portadaPerId: c ? c.id : null });
    });
  });
  return { conds, propis, places, nens, diff: places - nens.length };
}

/* ── Estat visual de la capçalera i la barra ── */
function estat(txt, mode){ const e = $("#estat"); e.textContent = txt; e.className = "chip-estat" + (mode === true || mode === "err" ? " err" : mode === "ok" ? " ok" : ""); }
let avisTimer = null;
function avis(txt, ok){
  const e = $("#avis");
  if (avisTimer){ clearTimeout(avisTimer); avisTimer = null; }
  if (ok){
    e.className = "avis ok"; e.innerHTML = txt;
    avisTimer = setTimeout(() => { e.className = "avis"; e.innerHTML = ""; avisTimer = null; }, 2600);
    return;
  }
  e.className = "avis";
  return avisVell(txt);
}
function avisVell(txt){
  const a = $("#avis");
  if (!txt){ a.style.display = "none"; return; }
  a.innerHTML = txt; a.style.display = "block";
  if (typeof a.scrollIntoView === "function"){ try { a.scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch(e){} }
}
function pintaPeuStats(){
  const el = $("#peu-stats"); if (!el) return;
  if (!doc || !doc.families || !doc.families.length){ el.innerHTML = ""; return; }
  const pl = (n, s, p) => n + " " + (n === 1 ? s : p);
  let nens = 0, viatges = 0, compartides = 0;
  doc.families.forEach(f => {
    nens += (f.nens || []).length;
    FRANGES.forEach(fr => DIES.forEach(d => {
      if (te(f.cotxe, fr.id, d)){ viatges++; compartides += portaValids(f, fr.id, d).length; }
    }));
  });
  el.innerHTML =
    "<span>\ud83d\udc6a " + pl(doc.families.length, "fam\u00edlia", "fam\u00edlies") + "</span>" +
    "<span>\ud83e\uddd2 " + pl(nens, "nen", "nens") + "</span>" +
    "<span>\ud83d\ude97 " + pl(viatges, "viatge en cotxe", "viatges en cotxe") + "/setmana</span>" +
    "<span>\ud83e\udd1d " + pl(compartides, "pla\u00e7a compartida", "places compartides") + "</span>";
}
function pintaBarra(){
  document.body.classList.toggle("amb-barra", dirty);
  pintaPeuStats();
  const tp = $(".targeta.perfil");
  if (tp) tp.classList.toggle("pendent", dirty);
  const ba = $("#barra-avis");
  if (ba && !ba.classList.contains("ocult") && ba.dataset.tipus !== "info"){
    const fb = lameva();
    if (fb && doblesDe(fb).length === 0 && celesPendents(fb).length === 0) barraAvisNeteja();
  } $("#barra").classList.toggle("amaga", !dirty); }

function doblesDe(f){
  const out = [];
  (f.nens || []).forEach(n => DIES.forEach(d2 => {
    if (te(n.marca, "e8", d2) && te(n.marca, "e9", d2)) out.push(n.nom.trim().split(/\s+/)[0] + " (" + DIES_NOM[d2] + ")");
  }));
  return out;
}
function barraAvis(html, tipus){ const b = $("#barra-avis"); if (!b) return; b.innerHTML = html; b.dataset.tipus = tipus || "valida"; b.classList.toggle("info", tipus === "info"); b.classList.remove("ocult"); }
function barraAvisNeteja(){ const b = $("#barra-avis"); if (b){ b.classList.add("ocult"); b.innerHTML = ""; } }
async function desa(){
  const fg = lameva();
  if (fg){
    const dobles = doblesDe(fg);
    if (dobles.length){
      barraAvis("\u26a0 <b>No es pot desar</b>: cada nen entra a les 8.00 <b>o</b> a les 9.00, no a totes dues. Ho tenen doblat: " + esc(dobles.join(", ")) + ". Toca la marca que sobri per treure-la.");
      if (tabAct !== "graella") triaTab("graella");
      return;
    }
    const pend = celesPendents(fg);
    if (pend.length){
      barraAvis("\u26a0 <b>No es pot desar encara</b>: falten <b>" + pend.length + "</b> caselles per respondre (\ud83d\ude97, \ud83d\ude4b o \ud83d\udeab; de les entrades 8.00/9.00 nom\u00e9s en cal una per nen). Primera: " + esc(pend[0]) + ". L'av\u00eds s'apagar\u00e0 sol quan la setmana sigui completa.");
      if (tabAct !== "graella") triaTab("graella");
      return;
    }
    barraAvisNeteja();
  }
  const b = $("#btn-desa"); b.disabled = true; $("#barra-txt").textContent = "Desant…"; estat("Desant…");
  try {
    const f = lameva();
    if (f){ f.usuaris = f.usuaris || []; if (f.usuaris.indexOf(usuariId) < 0) f.usuaris.push(usuariId); }
    await ghPut("Horari " + (f ? f.nom : "grup") + " · " + new Date().toLocaleDateString("ca"));
    dirty = false; pintaBarra(); pintaPeuStats(); estat("Desat ✓", "ok");
    avis("✓ <b>Desat</b> — els canvis ja són visibles per a tothom.", true);
  } catch(e){
    estat("No s'ha desat", true);

async function inici(){
  if (CONFIG.OWNER === "EL-TEU-USUARI-GITHUB"){

    $("#pantalla").innerHTML = "<div class='targeta'><h2>Falta configurar l'app</h2><p class='lead'>Obre <b>index.html</b> i canvia les 4 línies del bloc CONFIG de dalt de tot (usuari de GitHub, repositori de dades, fitxer i branca). Ho tens explicat pas a pas a INSTRUCCIONS.md.</p></div>";
    return;
  }
  if (!token){ pantallaClau(); return; }
  estat("Connectant…");
  try {
    const r = await ghGet(); doc = r.doc; sha = r.sha; normalitzaRols();
    if (!doc.families) doc.families = [];
    estat("Connectat ✓", "ok");
    if (famId && lameva()){ detectaAvisos(); pantallaApp(); } else { famId = ""; lsDel("cx_fam"); pantallaTria(); }
  } catch(e){
    if (e.tipus === "clau"){ token = ""; lsDel("cx_token"); pantallaClau("La clau no funciona. Revisa que l'hagis copiat sencera o demana la nova al grup."); }
    else if (e.tipus === "no-trobat"){ estat("Error", true); avis("No trobo <b>" + esc(CONFIG.FITXER) + "</b> al repositori <b>" + esc(CONFIG.OWNER + "/" + CONFIG.REPO_DADES) + "</b>. Comprova el bloc CONFIG i que el fitxer existeixi."); }
    else { estat("Sense connexió", true); avis("No puc connectar amb GitHub ara mateix. Comprova la connexió i recarrega la pàgina."); }
  }
}

let nfNens = [""], nfPl = 3;
function nfPlaces(d){ nfPl = Math.min(6, Math.max(0, nfPl + d)); $("#nf-pl").textContent = nfPl; }
function pintaNfNens(){

    (nfNens.length > 1 ? "<button class='mini-x' onclick='nfTreuNen(" + i + ")'>esborra</button>" : "") + "</div>").join("");
}
function nfAfegeixNen(){ if (nfNens.length < 6) nfNens.push(""); pintaNfNens(); }
function nfTreuNen(i){ nfNens.splice(i,1); pintaNfNens(); }

async function creaFam(){
  if (esStaff && !esAdmin){ avis("El rol de staff pot corregir famílies, però no crear-ne."); return; }
  if (!esAdmin && famId && lameva()){ avis("Aquest dispositiu ja té una família: " + lameva().nom + "."); return; }
  if (!esAdmin){
    const ja = doc.families.find(x => x.creadaPer === usuariId);
    if (ja){ avis("Aquest usuari ja va crear «" + ja.nom + "». Entra-hi amb el desplegable de dalt."); return; }
  }
  const cpare = $("#nf-cpare") ? $("#nf-cpare").value.trim() : "";
  const cmare = $("#nf-cmare") ? $("#nf-cmare").value.trim() : "";
  const nom = (cpare + " " + cmare).trim();
  const conductor = $("#nf-cond") ? $("#nf-cond").value.trim() : "";
  const nens = nfNens.map(s => s.trim()).filter(Boolean);
  if (!cpare || !cmare){ avis("Posa els dos cognoms: el del pare i el de la mare."); return; }
  if (!nens.length){ avis("Afegeix com a mínim un nen."); return; }
  if (doc.families.some(x => slug(x.nom) === slug(nom))){
    avis("Ja existeix una família que es diu «" + nom + "»: entra-hi amb el desplegable de dalt. Si de debò és una família diferent, canvia-li una mica el nom.");
    return;
  }
  avis("");
  let id = slug(nom) || "familia";
  while (doc.families.some(f => f.id === id)) id += "-2";
  const usats = {};
  const fam = { id: id, nom: nom, rol: "usuari", creadaPer: esAdmin ? "" : usuariId, usuaris: esAdmin ? [] : [usuariId], cognomPare: cpare, cognomMare: cmare, conductor: conductor, places: nfPl, cotxe: {}, nens: nens.map(n => {
    let nid = slug(n) || "nen"; while (usats[nid]) nid += "-2"; usats[nid] = 1;
    return { id: nid, nom: n, marca: {} };
  })};
  doc.families.push(fam); famId = id;
  estat("Desant…");
  try { await ghPut("Alta " + nom); lsSet("cx_fam", famId); estat("Desat ✓", "ok"); pantallaApp(); }
  catch(e){ doc.families = doc.families.filter(f => f.id !== id); famId = ""; estat("Error", true); avis("No s'ha pogut crear la família. Torna-ho a provar."); }
}
function triaFam(id){ famId = id; lsSet("cx_fam", id); pantallaApp(); }
async function entraSel(){
  const v = $("#sel-fam").value; if (!v) return;
  if (esAdmin){ triaFam(v); return; }
  if (esStaff){
    if (doc.adminFam && v === doc.adminFam){ avis("La fam\u00edlia de l'administrador nom\u00e9s la gestiona l'administrador."); return; }
    triaFam(v); return;
  }
  const fx = doc.families.find(x => x.id === v); if (!fx) return;
  if (!fx.usuaris) fx.usuaris = [];
  const meva = fx.creadaPer === usuariId || fx.usuaris.includes(usuariId);
  if (!meva){
    if (fx.creadaPer || fx.usuaris.length){
      if (!confirm("\u26a0 La fam\u00edlia \u00ab" + fx.nom + "\u00bb ja est\u00e0 en marxa en un altre m\u00f2bil.\n\nNom\u00e9s has de continuar si ets d'aquesta fam\u00edlia (pare, mare o tutor): tot el que editis \u00e9s seu.\n\nContinues?")) return;
    } else {
      fx.creadaPer = usuariId;
    }
    fx.usuaris.push(usuariId);
    estat("Desant\u2026");
    try { await ghPut("Nou m\u00f2bil a " + fx.nom); estat("Desat \u2713", "ok"); }
    catch(e){ estat("Error", true); }
  }
  triaFam(v);
}
async function rolFam(id){
  if (!esAdmin || !doc.adminFam || !lameva() || lameva().id !== doc.adminFam) return;
  const fx = doc.families.find(x => x.id === id); if (!fx) return;
  if (doc.adminFam && fx.id === doc.adminFam){ avis("Aquesta \u00e9s la fam\u00edlia de l'administrador: el seu rol \u00e9s fix."); return; }
  const antic = fx.rol;
  const nou = fx.rol === "staff" ? "usuari" : fx.rol === "admin" ? "usuari" : "staff";
  fx.rol = nou;
  estat("Desant\u2026");
  try { await ghPut("Rol de " + fx.nom + ": " + nou); estat("Desat \u2713", "ok"); if (tabAct === "rols") pintaRols(); else pantallaApp(); }
  catch(e){ fx.rol = antic; estat("Error", true); avis("No s'ha pogut canviar el rol."); }
}
function adminEdita(id){
  if (!esAdmin && !esStaff) return;
  if (!esAdmin && esStaff && doc.adminFam && id === doc.adminFam){ avis("La fam\u00edlia de l'administrador nom\u00e9s la gestiona l'administrador."); return; }
  tabAct = "perfil"; triaFam(id);
}

function tancaCasella(){ celObert = null; const m = $("#cel-menu"), v = $("#cel-vel"); if (m) m.classList.remove("obert"); if (v) v.classList.remove("obert"); }
function pintaCasella(){

  h += btn(te(f.cotxe, s, d), "\ud83d\ude97 Condu\u00efm nosaltres \u2014 els nens v\u00e9nen amb nosaltres \u00b7 " + f.places + " " + (f.places === 1 ? "pla\u00e7a" : "places"), "cotxe");

function celAccio(ac){
  if (!celObert) return;
  const s = celObert.slot, d = celObert.dia;
  if (ac === "demana"){
    const k = s + "-" + d + "|demana", ara = Date.now();
    if (ultimToc.k === k && ara - ultimToc.t < 350) return;
    ultimToc = { k: k, t: ara };
    const f = lameva(); if (!f || !f.nens.length) return;
    const cel = s + "-" + d;
    const portatsAbans = te(f.cotxe, s, d) ? portaValids(f, s, d).map(r => {
      const ff = doc.families.find(x => x.id === r.fam);
      const nn = ff && (ff.nens || []).find(x => x.id === r.nen);
      return nn ? nn.nom.trim().split(/\s+/)[0] : null;
    }).filter(Boolean) : [];
    const tots = f.nens.every(n => te(n.marca, s, d));
    if (tots){ f.nens.forEach(n => treu(n.marca, s, d)); }
    else {
      treu(f.propi, s, d);
      if (te(f.cotxe, s, d)){ treu(f.cotxe, s, d); if (f.porta) delete f.porta[cel]; }
      f.nens.forEach(n => {
        if (!te(n.marca, s, d)) commuta(n.marca, s, d);
        if (s === "e8") treu(n.marca, "e9", d); else if (s === "e9") treu(n.marca, "e8", d);
      });
    }
    netejaGermana(f, s, d);
    dirty = true; pintaBarra(); pintaGraella();
    if (portatsAbans.length && !te(f.cotxe, s, d)){
      const hhFr = (FRANGES.find(x => x.id === s) || {}).hora || "";
      barraAvis("\u2139\ufe0f Has tret el cotxe de " + DIES_NOM[d] + " " + hhFr + ": <b>" + esc(portatsAbans.join(" i ")) + "</b> es queden sense pla\u00e7a. Les seves fam\u00edlies ho veuran als Avisos quan desis.", "info");
    }
    pintaCasella();
    return;
  }
  triaPinzell(ac.indexOf("nen:") === 0 ? ac.slice(4) : ac);
  pinta(s, d);
  pintaCasella();
}
function netejaGermana(f, slot, dia){
  if (slot !== "e8" && slot !== "e9") return;
  if (!respon(f, slot, dia)) return;
  const g = slot === "e8" ? "e9" : "e8";
  const celG = g + "-" + dia;
  let portats = [];
  if (te(f.cotxe, g, dia)){
    portats = portaValids(f, g, dia).map(r => {
      const ff = doc.families.find(x => x.id === r.fam);
      const nn = ff && (ff.nens || []).find(x => x.id === r.nen);
      return nn ? nn.nom.trim().split(/\s+/)[0] : null;
    }).filter(Boolean);
    treu(f.cotxe, g, dia);
    if (f.porta) delete f.porta[celG];
  }
  treu(f.propi, g, dia);
  f.nens.forEach(n => treu(n.marca, g, dia));
  if (portats.length){
    barraAvis("\u2139\ufe0f L'entrada ha passat a les " + (slot === "e8" ? "8.00" : "9.00") + " i el cotxe de les " + (g === "e8" ? "8.00" : "9.00") + " s'ha tret: <b>" + esc(portats.join(" i ")) + "</b> es queden sense pla\u00e7a. Les seves fam\u00edlies ho veuran als Avisos quan desis.", "info");
  }
}
function pintaGraella(){

    if (i === 0 || FRANGES[i-1].tipus !== fr.tipus)
      h += "<div class='g-grup'>" + (fr.tipus === "Entrada" ? "🌅 Entrada" : "🎒 Recollida") + "</div>";
    h += "<div class='g-hora'>" + fr.hora + "</div>";
    DIES.forEach(d => {
      const cond = te(f.cotxe, fr.id, d);
      const propi = te(f.propi, fr.id, d);
      const marcats = f.nens.filter(n => te(n.marca, fr.id, d));
      let cls = "", cont = "";

      else if (marcats.length){
        const cobert = marcats.every(x => !!elPorta(f.id, x.id, fr.id, d));
        cls = "nec" + (cobert ? " cobert" : "");
        const inicialsNen = x => x.nom.trim().split(/\s+/).map(p => p[0].toUpperCase()).slice(0, 2).join("");
        cont = "<span class='c-ico'>🙋</span><span class='c-nom'>" + marcats.slice(0, 2).map(x => esc(inicialsNen(x))).join("·") + (marcats.length > 2 ? "+" : "") + "</span>";
      }
      h += "<button class='cel " + cls + "' onclick=\"obreCasella('" + fr.id + "','" + d + "')\" aria-label='" + DIES_NOM[d] + " " + fr.hora + "'>" + cont + "</button>";
    });
  });
  $("#graella").innerHTML = h;
}

function pinta(slot, dia){
  const f = lameva(); if (!f) return;
  const k = slot + "-" + dia + "|" + pinzell, ara = Date.now();
  if (ultimToc.k === k && ara - ultimToc.t < 350) return; // escut anti-tocs dobles
  ultimToc = { k: k, t: ara };
  if (!f.propi) f.propi = {};
  const cel = slot + "-" + dia;
  const portatsAbans = te(f.cotxe, slot, dia) ? portaValids(f, slot, dia).map(r => {
    const ff = doc.families.find(x => x.id === r.fam);
    const nn = ff && (ff.nens || []).find(x => x.id === r.nen);
    return nn ? nn.nom.trim().split(/\s+/)[0] : null;
  }).filter(Boolean) : [];
  const meusPre = f.nens.filter(n => te(n.marca, slot, dia) && elPorta(f.id, n.id, slot, dia)).map(n => ({ id: n.id, nom: n.nom.trim().split(/\s+/)[0] }));
  if (pinzell === "esborra"){ treu(f.cotxe, slot, dia); treu(f.propi, slot, dia); f.nens.forEach(n => treu(n.marca, slot, dia)); if (f.porta) delete f.porta[cel]; }
  else if (pinzell === "cotxe"){ treu(f.propi, slot, dia); commuta(f.cotxe, slot, dia); if (te(f.cotxe, slot, dia)) f.nens.forEach(n => treu(n.marca, slot, dia)); else if (f.porta) delete f.porta[cel]; }
  else if (pinzell === "propi"){ treu(f.cotxe, slot, dia); f.nens.forEach(n => treu(n.marca, slot, dia)); commuta(f.propi, slot, dia); if (f.porta) delete f.porta[cel]; }
  else { const n = f.nens.find(x => x.id === pinzell); if (!n){ pinzell = "cotxe"; pintaGraellaTab(); return; } treu(f.propi, slot, dia); if (te(f.cotxe, slot, dia)){ treu(f.cotxe, slot, dia); if (f.porta) delete f.porta[cel]; } commuta(n.marca, slot, dia); if (te(n.marca, slot, dia)){ if (slot === "e8") treu(n.marca, "e9", dia); else if (slot === "e9") treu(n.marca, "e8", dia); } }
  netejaGermana(f, slot, dia);
  dirty = true; pintaBarra(); pintaGraella();
  const hhFr = (FRANGES.find(x => x.id === slot) || {}).hora || "";
  const araCond = te(f.cotxe, slot, dia);
  if (portatsAbans.length && !araCond){
    barraAvis("\u2139\ufe0f Has tret el cotxe de " + DIES_NOM[dia] + " " + hhFr + ": <b>" + esc(portatsAbans.join(" i ")) + "</b> es queden sense pla\u00e7a. Les seves fam\u00edlies ho veuran als Avisos quan desis.", "info");
  } else {
    const meusAfectats = meusPre.filter(x => { const nn = f.nens.find(k => k.id === x.id); return !nn || !te(nn.marca, slot, dia) || araCond; });
    if (meusAfectats.length){
      barraAvis("\u2139\ufe0f " + esc(meusAfectats.map(x => x.nom).join(" i ")) + " ja no " + (meusAfectats.length === 1 ? "puja" : "pugen") + " al cotxe que tenien assignat (" + DIES_NOM[dia] + " " + hhFr + "). En desar, la pla\u00e7a quedar\u00e0 lliure i l'altra fam\u00edlia ho veur\u00e0 al calendari.", "info");
    }
  }
}

function afegeixNen(){

}

function entraAdmin(){

    if (doc.adminFam && (!fj || fj.id !== doc.adminFam)){
      avis("Nom\u00e9s la fam\u00edlia de l'administrador pot activar el mode admin.");

    esAdmin = true; lsSet("cx_admin", "1"); tancaAdmin(); return;

      avis("L'administrador primer ha d'assignar el rol de staff a la teva fam\u00edlia (bot\u00f3 de rol al directori \ud83d\udc65).");

function dibuixaCanvasHorari(fa){

function canvasABlob(cv){
  return new Promise(res => {
    if (!cv) return res(null);
    try {
      if (cv.toBlob){ cv.toBlob(b => res(b || null), "image/jpeg", 0.92); return; }
      const u = cv.toDataURL("image/jpeg", 0.92);
      const bin = atob(u.split(",")[1]), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      res(new Blob([arr], { type: "image/jpeg" }));
    } catch(e){ res(null); }
  });
}

    catch(e){ if (e && e.name === "AbortError") return; }

    document.body.appendChild(a); a.click(); a.remove();

  } catch(e){ avis("No s'ha pogut desar autom\u00e0ticament: fes una captura de pantalla del full."); }
}

        if (!c){ h += "<div class='fh-cel fh-buida'><div class='fh-barra'></div><div class='fh-mig'><div class='fh-titol'>\u2014</div></div></div>"; return; }
        h += "<div class='fh-cel " + palCls(c.pal) + "'><div class='fh-barra'></div><div class='fh-mig'><div class='fh-titol'>" + ICONA_PAL[c.pal] + " " + esc(c.titol) + "</div>" + (c.nota ? "<div class='fh-nota'>" + esc(c.nota) + "</div>" : "") + "</div></div>";
      });
      h += "</div>";
    });
  });
  h += "<div class='fh-llegenda'>" + llegenda.map(l => "<span class='fh-chip'><span class='fh-q' style='background:" + l[0] + "'></span>" + esc(l[1]) + "</span>").join("") + "</div>";
  h += "<div class='fh-peu'>De Montbui poble a l'Escola Anoia \u00b7 creat per V\u00edctor Quintana \u00b7 " + new Date().toLocaleDateString("ca") + "</div>";
  h += "</div>";
  return h;
}

  dv.innerHTML =

    "<button class='boto' onclick='comparteixFull()'>\ud83d\udce4 Desa / comparteix</button>" +
    (esAppInstalada || esIOS ? "" : "<button class='boto sec' onclick='imprimeixFull()'>\ud83d\udda8\ufe0f Imprimeix</button>") +

    (esAppInstalada || esIOS ? "<p class='hint' style='text-align:center;margin:0 0 8px'>\ud83d\udca1 Per imprimir: toca \u00ab\ud83d\udce4 Desa / comparteix\u00bb \u2192 <b>Desa la imatge</b> (va a Fotos) \u2192 obre-la a Fotos \u2192 <b>Imprimeix</b>.</p>" : "") +

function imprimeixFull(){ try { window.print(); } catch(e){ avis("Fes una captura de pantalla del full per desar-lo."); } }
function descarregaHorariNen(fid, nid){
  const fam = doc.families.find(x => x.id === fid);
  const nen = fam && (fam.nens || []).find(x => x.id === nid);
  if (!fam || !nen) return;
  const jo = nen.nom.trim().split(/\s+/)[0];
  const cont = {};
  FRANGES.forEach(fr => { cont[fr.id] = {}; DIES.forEach(d => {
    let c = null;
    if (te(fam.cotxe, fr.id, d)){
      const comp = fam.nens.filter(x => x.id !== nid).map(x => x.nom.trim().split(/\s+/)[0]).concat(nomsPortats(fam, fr.id, d));
      c = { pal: "fam", titol: fam.conductor || "la fam\u00edlia", nota: comp.length ? "amb " + comp.join(", ") : "hi va sol" };
    } else if (te(nen.marca, fr.id, d)){
      const cf = elPorta(fid, nid, fr.id, d);
      if (cf){
        const comp = nomsPortats(cf, fr.id, d).filter(x => x !== jo).concat((cf.nens || []).map(x => x.nom.trim().split(/\s+/)[0]));
        c = { pal: "ok", titol: nomConductor(cf), nota: comp.length ? "amb " + comp.join(", ") : "hi va sol" };
      } else {
        c = { pal: "pend", titol: "pendent", nota: "cal conductor" };
      }
    } else if (te(fam.propi, fr.id, d)){
      c = { pal: "propi", titol: "pel seu compte", nota: "" };
    }
    if (c) cont[fr.id][d] = c;
  }); });
  const lleg = [["#2e8047", "cotxe compartit (el nom \u00e9s qui condueix)"], ["#1d4a6e", "amb la seva fam\u00edlia"], ["#9aa6b0", "pel seu compte"], ["#d64545", "pendent de conductor"]];
  fullActual = { titol: "Horari de " + nen.nom, sub: "Amb qui va cada dia \u00b7 " + fam.nom, cont: cont, fitxer: "horari-" + slug(nen.nom) + ".jpg", distintiu: "FULL DEL NEN", llegenda: lleg };
  mostraFull(fullHorariHtml("Horari de " + nen.nom, "Amb qui va cada dia \u00b7 " + fam.nom, cont, "FULL DEL NEN", lleg));
}

function descarregaHorariConductor(){
  const f = lameva(); if (!f) return;
  const cont = {};
  FRANGES.forEach(fr => { cont[fr.id] = {}; DIES.forEach(d => {
    let c = null;
    if (te(f.cotxe, fr.id, d)){
      const tots = f.nens.map(x => x.nom.trim().split(/\s+/)[0]).concat(nomsPortats(f, fr.id, d));
      const lliures = Math.max(0, (f.places || 0) - portaValids(f, fr.id, d).length);
      const pl = lliures + (lliures === 1 ? " pla\u00e7a lliure" : " places lliures");
      c = { pal: "ok", titol: tots.length ? "portes " + tots.length : "el teu cotxe",
            nota: (tots.length ? tots.join(", ") : "sense passatgers") + " \u00b7 " + pl };
    } else if (te(f.propi, fr.id, d)){
      c = { pal: "propi", titol: "pel vostre compte", nota: "" };
    }
    if (c) cont[fr.id][d] = c;
  }); });
  const lleg = [["#2e8047", "viatges que condueixes (amb els nens i les places que et queden)"], ["#9aa6b0", "pel vostre compte"]];
  fullActual = { titol: "Horari del conductor \u2014 " + nomConductor(f), sub: "Qui puges a cada viatge \u00b7 " + f.nom, cont: cont, fitxer: "horari-conductor-" + slug(nomConductor(f)) + ".jpg", distintiu: "FULL DEL CONDUCTOR", llegenda: lleg };
  mostraFull(fullHorariHtml("Horari del conductor \u2014 " + nomConductor(f), "Qui puges a cada viatge \u00b7 " + f.nom, cont, "FULL DEL CONDUCTOR", lleg));
}

function pintaDescarrega(){
  const f = lameva();
  let h = "<div class='targeta'><div class='p-fila'><span class='p-lab'>\ud83d\udda8\ufe0f Horaris per imprimir<span class='p-sub'>s'obren a pantalla \u2192 Imprimeix o desa'ls en PDF des del di\u00e0leg del m\u00f2bil</span></span></div>";
  (f.nens || []).forEach(n2 => {
    const p = nenPendents(f, n2);
    const nomC = esc(n2.nom.trim().split(/\s+/)[0]);
    h += "<button class='boto sec' style='width:100%;margin-top:8px' onclick=\"descarregaHorariNen('" + f.id + "','" + n2.id + "')\">\ud83d\udda8\ufe0f Horari de " + nomC + "</button>";
    if (p) h += "<p class='hint' style='margin:4px 0 0'>\u26a0 " + nomC + " t\u00e9 " + (p === 1 ? "1 trajecte" : p + " trajectes") + " sense conductor: al full " + (p === 1 ? "surt" : "surten") + " en vermell com a \u00abpendent\u00bb.</p>";
  });
  const condueix = FRANGES.some(fr => DIES.some(d => te(f.cotxe, fr.id, d)));
  h += condueix
    ? "<button class='boto sec' style='width:100%;margin-top:12px' onclick='descarregaHorariConductor()'>\ud83d\udda8\ufe0f Horari del conductor (" + esc(nomConductor(f)) + ")</button>"
    : "<p class='hint' style='margin:10px 0 0'>Aquesta setmana no condu\u00efu cap dia: no hi ha horari de conductor a generar.</p>";
  h += "</div>";
  $("#tab-cos").innerHTML = h;
}
function pintaVistaNen(){
  const tots = [];
  famOrd().forEach(f => (f.nens || []).forEach(n => tots.push({ v: f.id + "|" + n.id, nom: n.nom, fam: f })));
  if (!tots.length){ $("#cal-cos").innerHTML = "<p class='lead'>Encara no hi ha nens al grup.</p>"; return; }
  const meva = lameva();
  if (!nenSel || !tots.some(x => x.v === nenSel)){
    const meu = meva ? tots.find(x => x.fam.id === meva.id) : null;
    nenSel = (meu || tots[0]).v;
  }
  const sel = "<select class='input' onchange='selNenCanvia(this.value)'>" +
    tots.map(x => "<option value='" + x.v + "'" + (x.v === nenSel ? " selected" : "") + ">" + esc(x.nom) + " (" + esc(x.fam.nom) + ")</option>").join("") +
    "</select>";
  const famId2 = nenSel.split("|")[0], nenId2 = nenSel.split("|")[1];
  const fam = doc.families.find(x => x.id === famId2);
  const nen = fam ? (fam.nens || []).find(x => x.id === nenId2) : null;
  let h = "<div class='fila' style='margin-bottom:12px'>" + sel + "</div>";
  if (nen){
    let res = "";
    DIES.forEach(d => {
      let linies = "";
      FRANGES.forEach(fr => {
        let txt = "";
        if (te(fam.cotxe, fr.id, d)) txt = "\ud83d\ude97 hi va amb la seva fam\u00edlia" + (fam.conductor ? " (" + esc(fam.conductor) + ")" : "");
        else if (te(nen.marca, fr.id, d)){
          const c = elPorta(famId2, nenId2, fr.id, d);
          txt = c ? "\ud83d\ude97 <b>el porta " + esc(nomConductor(c)) + "</b>"
                  : "<span class='a-pend'>\u23f3 pendent d'assignar</span>";
        } else if (te(fam.propi, fr.id, d)) txt = "\ud83d\udeab pel seu compte";
        if (txt) linies += "<div class='f-linia'><b style='width:56px;display:inline-block'>" + fr.hora + "</b> " + txt + "</div>";
      });
      if (linies) res += "<div class='targeta franja'><div class='f-cap'><span class='f-hora'>" + DIES_NOM[d] + "</span></div>" + linies + "</div>";
    });
    h += res || "<p class='lead'>Aquest nen no t\u00e9 cap trajecte marcat.</p>";
  }
  $("#cal-cos").innerHTML = h;
}
function selNenCanvia(v){ nenSel = v; pintaVistaNen(); }

function pintaQuadre(){
  const pila = s => s.trim().split(/\s+/)[0];
  const llista = arr => arr.map(esc).join(", ").replace(/, ([^,]*)$/, " i $1");
  let h = "";
  DIES.forEach(d => {
    let linies = "";
    let pendTot = 0;
    let hiHa = false;
    FRANGES.forEach(fr => {
      const b = balanc(fr.id, d);
      const pend = b.nens.filter(n => !n.portadaPer);
      b.conds.forEach(c => {
        hiHa = true;
        const noms = (c.nens || []).map(n => pila(n.nom));
        portaValids(c, fr.id, d).forEach(r => {
          const ff = doc.families.find(x => x.id === r.fam);
          const nn = ff ? (ff.nens || []).find(x => x.id === r.nen) : null;
          if (nn) noms.push(pila(nn.nom));
        });
        linies += "<div class='qd-linia'><span class='qd-hora'>" + fr.hora + "</span><span class='qd-cotxe'>\ud83d\ude97 <b>" + esc(nomConductor(c)) + "</b>" +
          (noms.length ? " porta <b>" + llista(noms) + "</b>" : " \u00b7 encara ning\u00fa (" + c.places + " lliures)") + "</span></div>";
      });
      if (pend.length){
        hiHa = true; pendTot += pend.length;
        linies += "<div class='qd-linia'><span class='qd-hora'>" + fr.hora + "</span><span class='qd-sense'>\u23f3 Sense cotxe: <b>" + llista(pend.map(n => pila(n.nom))) + "</b></span></div>";
      }
    });
    const chip = !hiHa ? "<span class='badge buit'>res marcat</span>"
      : pendTot ? "<span class='badge mal'>\u26a0 " + pendTot + " sense cotxe</span>"
      : "<span class='badge be'>\u2713 tot quadrat</span>";
    h += "<div class='targeta dcard'><div class='d-cap qd-cap' onclick=\"obreDiaDes('" + d + "')\"><h3>" + DIES_NOM[d] + "</h3>" + chip + "</div>" +
         (linies || "<p class='hint' style='margin:2px 0 4px'>Cap trajecte marcat.</p>") +
         (hiHa ? "<div style='text-align:right;margin-top:2px'><button class='enllac' onclick=\"obreDiaDes('" + d + "')\">veure i assignar \u2192</button></div>" : "") +
         "</div>";
  });
  $("#cal-cos").innerHTML = h;
}
function obreDiaDes(d){ vistaCal = "dia"; diaSel = d; renderCal(); }

/* \u2500\u2500 Pestanya: resum final del grup \u2500\u2500 */
async function pintaResum(){
  if (!dirty){
    try { const r = await ghGet(); doc = r.doc; sha = r.sha; normalitzaRols(); if (!doc.families) doc.families = []; if (!lameva()){ famId = ""; lsDel("cx_fam"); pantallaTria(); return; } } catch(e){}
  }
  const defs = [], justs = [], marges = [];
  let buides = 0, totPlaces = 0, totNens = 0;
  DIES.forEach(d => FRANGES.forEach(fr => {
    const b = balanc(fr.id, d);
    if (!b.conds.length && !b.nens.length){ buides++; return; }
    totPlaces += b.places; totNens += b.nens.length;
    const it = { d: d, fr: fr, b: b };
    if (b.diff < 0) defs.push(it);
    else if (b.diff === 0) justs.push(it);
    else marges.push(it);
  }));
  const pendents = doc.families.filter(f => {
    const c = Object.keys(f.cotxe || {}).some(k => f.cotxe[k] && f.cotxe[k].length);
    const n = (f.nens || []).some(x => Object.keys(x.marca || {}).some(k => x.marca[k] && x.marca[k].length));
    const p = Object.keys(f.propi || {}).some(k => f.propi[k] && f.propi[k].length);
    return !c && !n && !p;
  });
  const filaDet = (it, cls) => {
    const b = it.b;
    const txt = b.places + " " + (b.places === 1 ? "plaça" : "places") + " per a " + b.nens.length + " " + (b.nens.length === 1 ? "nen" : "nens");
    const pt = b.diff < 0 ? "−" + (-b.diff) : b.diff === 0 ? "0" : "+" + b.diff;
    const conds = b.conds.map(f => esc(f.nom) + " (" + (f.conductor ? esc(f.conductor) + " · " : "") + f.places + " " + (f.places === 1 ? "lliure" : "lliures") + ")").join(" · ");
    const noms = b.nens.map(n => esc(n.nom)).join(" · ");
    let det = "";
    if (conds) det += "<div>🚗 " + conds + "</div>";
    if (noms) det += "<div>🙋 " + noms + "</div>";
    det += "<button class='enllac' onclick=\"selDia('" + it.d + "')\">obre el dia →</button>";
    return "<details class='r-det'><summary class='r-fila'><span class='r-dia'>" + DIES_NOM[it.d] + "</span>" +
           "<span class='r-hora'>" + it.fr.hora + "</span><span class='r-txt'>" + txt + "</span>" +
           "<span class='mp " + cls + "'>" + pt + "</span><span class='r-fletxa'>▾</span></summary>" +
           "<div class='r-nens'>" + det + "</div></details>";
  };
  const nNens = doc.families.reduce((s,f) => s + (f.nens || []).length, 0);
  let h = "<div class='targeta'><h2>L'estat del grup</h2><div class='r-stats'>" +
    "<div><b>" + doc.families.length + "</b><span>fam\u00edlies</span></div>" +
    "<div><b>" + nNens + "</b><span>nens</span></div>" +
    "<div><b>" + totPlaces + "</b><span>places ofertes/setm.</span></div>" +
    "<div><b>" + totNens + "</b><span>trajectes a cobrir</span></div></div>" +
    (pendents.length
      ? "<p class='lead' style='margin:10px 0 0'>\u23f3 Encara no han marcat res: <b>" + pendents.map(f => esc(f.nom)).join(", ") + "</b></p>"
      : "<p class='lead' style='margin:10px 0 0;color:#1F5C3B'><b>\u2713 Totes les fam\u00edlies han omplert l'horari.</b></p>") +
    "</div>";
  h += defs.length
    ? "<div class='targeta t-def'><h2 style='color:#8F2B1C'>\u2757 Falta cobrir</h2>" + defs.map(it => filaDet(it, "def")).join("") +
      "<p class='hint' style='margin:8px 2px 0'>Toca una l\u00ednia per veure els nens; \u00abobre el dia \u2192\u00bb per anar-hi.</p></div>"
    : "<div class='targeta t-ok'><h2 style='color:#1F5C3B'>\ud83c\udf89 Tot cobert</h2><p class='lead' style='margin:0'>Cap nen sense pla\u00e7a en tota la setmana.</p></div>";
  if (justs.length) h += "<div class='targeta t-just'><h2 style='color:#6E4E00'>Va just (sense marge)</h2>" + justs.map(it => filaDet(it, "just")).join("") + "</div>";
  if (marges.length) h += "<div class='targeta t-ok'><h2 style='color:#1F5C3B'>On sobren places</h2>" + marges.map(it => filaDet(it, "ok")).join("") + "<p class='hint' style='margin:8px 2px 0'>Toca una línia per veure els cotxes i les seves places.</p></div>";
  if (buides) h += "<p class='hint' style='text-align:center'>" + buides + " franges sense ning\u00fa apuntat.</p>";
  $("#cal-cos").innerHTML = h;
}
