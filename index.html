@media print{
  /* #full-horari és fill directe de body: la resta s'amaga amb display:none,
     que sí que allibera l'espai (amb visibility el document feia 2 pàgines) */
  body > *:not(#full-horari){display:none !important}
  html, body{height:auto !important;overflow:visible !important;background:#fff !important;display:block !important;margin:0;padding:0}
  #full-horari{display:block !important;position:static !important;inset:auto;overflow:visible;padding:0;background:#fff}
  .fh-eines, .hint{display:none !important}
  /* Chrome no imprimeix fons per defecte: es força el color exacte */
  .fh-full, .fh-full *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  /* el full ocupa exactament l'A4 apaïsat útil (297−16 × 210−16 mm) */
  .fh-full{width:281mm;height:194mm;max-width:none;margin:0;display:grid;grid-template-rows:auto auto auto 1fr auto auto;gap:2mm;page-break-inside:avoid;break-inside:avoid;page-break-after:avoid}
  .fh-cos{display:grid;grid-template-rows:auto 1fr 1fr auto 1fr auto 1fr auto 1fr;gap:1.6mm;min-height:0}
  .fh-fila{page-break-inside:avoid;break-inside:avoid;min-height:0}
  .fh-cel{min-height:0}
  .fh-hora{justify-content:flex-end;padding-right:6px}
  .fh-zebra{background-color:#c9d6e4}   /* reserva sòlida si el navegador no pinta el gradient */
}

  // Només el curs de cada fill: families.curs ja no es fa servir enlloc.

  // l'entrada que fixa el curs per a aquell dia (null = sense curs: qualsevol)
  if (c === "1r ESO" || c === "2n ESO") return (CURS12_E8[c] || []).includes(dia) ? "e8" : "e9";
  if (c === "3r ESO" || c === "4t ESO") return "e8";   // 3r/4t fan SEMPRE l'entrada matinera

function nenTeCasella(n, slot, dia){
  // si el NEN (pel seu curs) té aquesta casella aquest dia
  const c = (n.curs || "").trim();
  if (!c) return true;   // sense curs: tot obert (i el Perfil surt incomplet)

   assignacions desades a Supabase. Per canviar una hora, toca només FRANGES. */
function horaDe(id){ const f = FRANGES.find(x => x.id === id); return f ? f.hora : id; }

/* ── Estat ── */

async function sbDesaFamilia(f){
  // 1 · fila de la família (nom, cognoms, conductor, places)
  let r = await sb.from("families").update({
    name: f.nom, cognom1: f.cognomPare || "", cognom2: f.cognomMare || "",
    driver: f.conductor || "", seats: Math.min(6, Math.max(0, f.places || 0)),
    phone: f.phone || "", phone_visible: f.phoneVisible !== false
  }).eq("id", f.id);
  if (r.error) throw r.error;
  // 2 · fills: diff per conservar els ids (les assignacions els referencien)
  r = await sb.from("children").select("id,name,curs").eq("family_id", f.id);
  if (r.error) throw r.error;
  const antics = r.data || [];
  for (const x of antics){
    if (f.nens.some(n => n.id === x.id)) continue;
    const d = await sb.from("children").delete().eq("id", x.id);
    if (d.error) throw d.error;
  }
  for (const n of f.nens){
    const ant = antics.find(x => x.id === n.id);
    if (!ant){
      const ins = await sb.from("children").insert({ family_id: f.id, name: n.nom, curs: n.curs || "" }).select();
      if (ins.error) throw ins.error;
      n.id = ins.data[0].id;   // uuid definitiu
    } else if (ant.name !== n.nom || (ant.curs || "") !== (n.curs || "")){
      const up = await sb.from("children").update({ name: n.nom, curs: n.curs || "" }).eq("id", n.id);
      if (up.error) throw up.error;
    }
  }
  // 3 · marques setmanals: es reescriuen totes les de la família
  let d = await sb.from("weekly_marks").delete().eq("family_id", f.id);
  if (d.error) throw d.error;
  const files = [];
  FRANGES.forEach(fr => DIES.forEach(dia => {
    if (estatCasella(f, fr.id, dia) !== "normal") return;   // casella en blanc: no es desa res
    if (te(f.cotxe, fr.id, dia)) files.push({ family_id: f.id, slot: fr.id, day: dia, type: "drive" });
    else if (te(f.propi, fr.id, dia)) files.push({ family_id: f.id, slot: fr.id, day: dia, type: "own" });
    else {
      const idsNens = f.nens.filter(n => te(n.marca, fr.id, dia) && nenTeCasella(n, fr.id, dia)).map(n => n.id);
      if (idsNens.length) files.push({ family_id: f.id, slot: fr.id, day: dia, type: "request", children_ids: idsNens });
    }
  }));
  if (files.length){
    const im = await sb.from("weekly_marks").insert(files);
    if (im.error) throw im.error;
  }
  // 4 · assignacions on condueix aquesta família: es reescriuen (només les vàlides)
  d = await sb.from("assignments").delete().eq("driver_family_id", f.id);
  if (d.error) throw d.error;
  const ass = [];
  FRANGES.forEach(fr => DIES.forEach(dia => {
    if (!te(f.cotxe, fr.id, dia) || estatCasella(f, fr.id, dia) !== "normal") return;
    portaValids(f, fr.id, dia).forEach(ref => ass.push({
      group_id: grupActiu.id, driver_family_id: f.id, child_id: ref.nen, slot: fr.id, day: dia
    }));
  }));
  if (ass.length){
    const ia = await sb.from("assignments").insert(ass);
    if (ia.error) throw ia.error;
  }
}

/* ── Utilitats de marques ── */
function te(m, slot, dia){ return !!(m && m[slot] && m[slot].indexOf(dia) >= 0); }
function posa(m, slot, dia){ if (!m[slot]) m[slot] = []; if (m[slot].indexOf(dia) < 0) m[slot].push(dia); }
function treu(m, slot, dia){ if (m && m[slot]) m[slot] = m[slot].filter(d => d !== dia); }
function commuta(m, slot, dia){ if (te(m, slot, dia)) treu(m, slot, dia); else posa(m, slot, dia); }
function lameva(){ return doc ? doc.families.find(f => f.id === famId) : null; }
function famOrd(){ return doc.families.slice().sort((a,b) => a.nom.localeCompare(b.nom, "ca")); }

function portaValids(f, slot, dia){
  if (estatCasella(f, slot, dia) !== "normal") return [];   // el conductor no té aquesta casella
  const refs = (f.porta && f.porta[slot + "-" + dia]) || [];
  return refs.filter(r => {
    const ff = doc.families.find(x => x.id === r.fam);
    if (!ff || estatCasella(ff, slot, dia) !== "normal") return false;   // el nen no té aquesta casella
    const nn = (ff.nens || []).find(x => x.id === r.nen);
    return !!nn && te(nn.marca, slot, dia) && nenTeCasella(nn, slot, dia) && !te(ff.cotxe, slot, dia);
  });
}
function elPorta(famId, nenId, slot, dia){
  return doc.families.find(fc => te(fc.cotxe, slot, dia) &&
    portaValids(fc, slot, dia).some(r => r.fam === famId && r.nen === nenId)) || null;
}
function respon(f, slot, dia){ return te(f.cotxe, slot, dia) || te(f.propi, slot, dia) || (f.nens || []).some(n => te(n.marca, slot, dia)); }
function perfilComplet(f){ return !!(f && f.nom && (f.cognomPare || "").trim() && (f.conductor || "").trim() && f.nens && f.nens.length && f.nens.every(n => (n.curs || "").trim())); }
function celesPendents(f){
  const p = [];
  const teCursos = cursosDe(f).size > 0;
  DIES.forEach(d => {
    const e8n = estatCasella(f, "e8", d) === "normal", e9n = estatCasella(f, "e9", d) === "normal";
    if (!teCursos){
      // sense cap curs: les dues entrades són una sola resposta (fins que el Perfil no és complet)
      if (e8n && e9n && !respon(f, "e8", d) && !respon(f, "e9", d)) p.push(DIES_NOM[d] + " entrada (" + horaDe("e8") + " o " + horaDe("e9") + ")");
    } else {
      // amb cursos, l'hora d'entrada la fixa el curs: cada entrada oberta és d'uns nens concrets i cal respondre-la
      if (e8n && !respon(f, "e8", d)) p.push(DIES_NOM[d] + " entrada " + horaDe("e8"));
      if (e9n && !respon(f, "e9", d)) p.push(DIES_NOM[d] + " entrada " + horaDe("e9"));
    }
    ["r13", "e15", "r17"].forEach(s => {
      if (estatCasella(f, s, d) !== "normal") return;   // les caselles en blanc no compten mai
      if (!respon(f, s, d)){ const fr = FRANGES.find(x => x.id === s); p.push(DIES_NOM[d] + " " + fr.hora); }
    });
  });
  return p;
}
function graellaCompleta(f){ return celesPendents(f).length === 0; }
/* El 🚗 i el 🚫 són de tota la família i valen per a tots els fills;
   el 🙋 és de cada fill. Això és el que fa que la graella es pugui
   partir per fill sense duplicar cap dada. */
function responNen(f, n, slot, dia){
  return te(f.cotxe, slot, dia) || te(f.propi, slot, dia) || te(n.marca, slot, dia);
}
/* Les caselles que li falten a UN fill. celesPendents(f) segueix sent la font
   de veritat per desar i per desbloquejar els Calendaris; aquesta és per
   mostrar de qui són. */
/* v4.50: cap casella d'aquest fill té resposta encara — mateixos criteris que
   celesPendentsNen/estatCasella, però perquè la targeta mostri el missatge
   de benvinguda en lloc de l'avís de pendents. */
function nenGraellaBuida(f, n){
  return DIES.every(d => FRANGES.every(fr =>
    !nenTeCasella(n, fr.id, d) || estatCasella(f, fr.id, d) !== "normal" || !responNen(f, n, fr.id, d)));
}
function celesPendentsNen(f, n){
  const p = [];
  const teCurs = !!(n.curs || "").trim();
  DIES.forEach(d => {
    if (!teCurs){
      if (!responNen(f, n, "e8", d) && !responNen(f, n, "e9", d))
        p.push(DIES_NOM[d] + " entrada (" + horaDe("e8") + " o " + horaDe("e9") + ")");
    } else {
      ["e8", "e9"].forEach(s2 => {
        if (nenTeCasella(n, s2, d) && !responNen(f, n, s2, d)) p.push(DIES_NOM[d] + " entrada " + horaDe(s2));
      });
    }
    ["r13", "e15", "r17"].forEach(s2 => {
      if (nenTeCasella(n, s2, d) && !responNen(f, n, s2, d)) p.push(DIES_NOM[d] + " " + horaDe(s2));
    });
  });
  return p;
}

function nomConductor(f){
  if (!f) return "";
  const inis = f.nom.trim().split(/\s+/).map(p => p[0].toUpperCase()).slice(0, 2).join("");
  if (f.conductor && f.conductor.trim()){
    return f.conductor.trim().split(/\s+/)[0] + " " + inis;
  }
  return f.nom;
}
function nomConductorComplet(f){
  if (!f) return "";
  const cond = (f.conductor || "").trim().split(/\s+/)[0];
  return cond ? cond + " " + f.nom : f.nom;
}
function balanc(slot, dia){
  const conds = doc.families.filter(f => te(f.cotxe, slot, dia) && estatCasella(f, slot, dia) === "normal");
  const propis = doc.families.filter(f => te(f.propi, slot, dia) && estatCasella(f, slot, dia) === "normal");
  const places = conds.reduce((s,f) => s + (f.places || 0), 0);
  const nens = [];
  doc.families.forEach(f => {
    if (estatCasella(f, slot, dia) !== "normal") return; // casella en blanc: no compta res
    if (te(f.cotxe, slot, dia) || te(f.propi, slot, dia)) return; // coberts per la mateixa família
    (f.nens || []).forEach(n => {
      if (!te(n.marca, slot, dia)) return;
      const c = elPorta(f.id, n.id, slot, dia);
      nens.push({ nom: n.nom, fam: f.nom, famId: f.id, nenId: n.id, portadaPer: c ? nomConductor(c) : null, portadaPerId: c ? c.id : null });
    });
  });
  return { conds, propis, places, nens, diff: places - nens.length };
}

/* Cobertura de trajectes: dem = trajectes de nens a cobrir de tot el grup,
   cob = els que ja tenen cotxe, meus = els que cobreix el MEU cotxe.
   balanc() ja exclou les caselles en blanc per curs. */
/* v4.32: la barra 🎯 del grup és la SUMA de les barres per família
   (statsCoberturaFam: viatges oferts coberts / oferts) — la mateixa xifra
   que «✓ viatges coberts al 100 %» del peu. La mirada dels nens va a part:
   dem = demandes 🙋 · ambCotxe = amb cotxe · esperenAmb = esperen en
   viatges on algú ofereix cotxe · senseCotxe = en viatges on ningú no
   n'ofereix (la xifra que explica el forat). */
function statsCobertura(){
  let tot = 0, cob = 0;
  ((doc && doc.families) || []).forEach(f => { const s2 = statsCoberturaFam(f); tot += s2.tot; cob += s2.cob; });
  let dem = 0, ambCotxe = 0, esperenAmb = 0, senseCotxe = 0;
  DIES.forEach(d2 => FRANGES.forEach(fr => {
    const b = balanc(fr.id, d2);
    b.nens.forEach(n => {
      dem++;
      if (n.portadaPerId) ambCotxe++;
      else if (b.conds.length) esperenAmb++;
      else senseCotxe++;
    });
  }));
  return { tot: tot, cob: cob, dem: dem, ambCotxe: ambCotxe, esperenAmb: esperenAmb, senseCotxe: senseCotxe };
}
function liniaNensHtml(st){

    st.ambCotxe + " amb cotxe \u00b7 " + st.esperenAmb + " esperen en viatges amb cotxe \u00b7 " +
    st.senseCotxe + " en viatges on ning\u00fa ofereix cotxe</div>";
}
/* v4.23: cobertura d'UNA família — els seus trajectes són els cotxes que
   ofereix i les demandes dels seus fills. Un viatge OFERT compta com a
   cobert NOMÉS quan cap nen no s'hi queda esperant plaça (tots els que la
   demanen tenen cotxe, meu o d'un altre) o quan el cotxe ja és ple: així,
   marcar nens a «Qui puges al teu cotxe?» mou la barra a l'instant. Les
   demandes dels fills es cobreixen quan algú els porta. pend = nens que
   esperen plaça als SEUS viatges (el recompte d'El teu cotxe). */
/* Un viatge OFERT (el 🚗 d'una família en una casella) està COBERT quan cap
   nen no s'hi queda esperant plaça o el cotxe ja és ple — la regla de la
   barra «per tu» (v4.23), compartida amb el peu d'estadístiques (v4.27). */
function viatgeCobert(f, slot, dia){
  const refs = portaValids(f, slot, dia);
  const esperen = balanc(slot, dia).nens.filter(n => (!n.portadaPerId || n.portadaPerId === f.id) &&
    !refs.some(r2 => r2.fam === n.famId && r2.nen === n.nenId)).length;
  return { esperen: esperen, ocupades: refs.length, cobert: !esperen || refs.length >= (f.places || 0) };
}
/* v4.30: la barra «per tu» compta NOMÉS els viatges que la família OFEREIX:
   total = caselles amb el seu 🚗; cobert = viatgeCobert (ningú esperant o
   cotxe ple). Els 🙋 dels fills NO hi compten (tenen la seva pròpia mirada
   al Resum i a la línia dels nens del grup). pend = nens esperant als seus
   viatges. Estadístiques (admin) fa servir aquesta mateixa definició. */
function statsCoberturaFam(f){
  let tot = 0, cob = 0, pend = 0;
  DIES.forEach(d2 => FRANGES.forEach(fr => {
    if (estatCasella(f, fr.id, d2) !== "normal") return;
    if (!te(f.cotxe, fr.id, d2)) return;
    tot++;
    const vc = viatgeCobert(f, fr.id, d2);
    pend += vc.esperen;
    if (vc.cobert) cob++;
  }));
  return { tot: tot, cob: cob, pend: pend };
}
function barraCobHtml(titol, val, tot, sub, clic){
  const pct = tot ? Math.round(val * 100 / tot) : 0;
  return "<div class='barra-cob'" + (clic ? " onclick=\"" + clic + "\"" : "") + ">" +
    "<div class='bc-cap'><span>" + titol + "</span><b>" + (tot ? val + " de " + tot + " \u00b7 " + pct + " %" : "Encara no hi ha trajectes a cobrir") + "</b></div>" +
    "<div class='bc-pista'><div class='bc-ompl " + (tot && pct === 100 ? "fet" : (pct < 50 && tot ? "baix" : "")) + "' style='width:" + (tot ? pct : 0) + "%'></div><i style='left:25%'></i><i style='left:50%'></i><i style='left:75%'></i></div>" +
    (sub || "") + "</div>";
}
/* v4.27: la fila d'estadístiques del grup — la mateixa al peu i a dalt de
   l'apartat Estadístiques. «Setmana completa» = el criteri de la pastilla ✓
   de la Graella (cap casella pendent); «cobert al 100 %» = viatgeCobert. */
function peuStatsHtml(){
  if (!doc || !doc.families || !doc.families.length) return "";
  const pl = (n, s, p) => n + " " + (n === 1 ? s : p);
  let nens = 0, oferts = 0, coberts = 0, ocupades = 0, ofertes = 0, completes = 0;
  doc.families.forEach(f => {
    nens += (f.nens || []).length;
    if (!celesPendents(f).length) completes++;
    FRANGES.forEach(fr => DIES.forEach(d => {
      if (!te(f.cotxe, fr.id, d)) return;
      oferts++; ofertes += (f.places || 0);
      const vc = viatgeCobert(f, fr.id, d);
      ocupades += vc.ocupades;
      if (vc.cobert) coberts++;
    }));
  });
  return "<span>\ud83d\udc6a " + pl(doc.families.length, "fam\u00edlia", "fam\u00edlies") + " (" + completes + " amb la setmana completa)</span>" +
    "<span>\ud83e\uddd2 " + pl(nens, "nen", "nens") + "</span>" +
    "<span>\ud83d\ude97 " + pl(oferts, "viatge ofert", "viatges oferts") + "/setmana</span>" +
    "<span>\u2713 " + coberts + (coberts === 1 ? " viatge cobert" : " viatges coberts") + " al 100 %</span>" +
    "<span>\ud83e\udd1d " + pl(ocupades, "seient ocupat", "seients ocupats") + "</span>" +
    "<span>\ud83d\udcba " + pl(Math.max(0, ofertes - ocupades), "seient lliure", "seients lliures") + "</span>";
}
function pintaPeuStats(){
  const el = $("#peu-stats"); if (!el) return;
  const fila = peuStatsHtml();
  if (!fila){ el.innerHTML = ""; return; }
  // Barra de progrés de TOT EL GRUP (la del peu)
  const st = statsCobertura();
  const barra = barraCobHtml("\ud83c\udfaf Trajectes coberts del grup", st.cob, st.tot, liniaNensHtml(st), "obreResumDesDePeu()");
  el.innerHTML = fila + barra;
}
function obreResumDesDePeu(){ if (!potCal()) return; triaTab("cal"); triaVistaCal("resum"); }
function pintaBarra(){
  document.body.classList.toggle("amb-barra", dirty);
  pintaPeuStats();
  const tp = $(".targeta.perfil");
  if (tp) tp.classList.toggle("pendent", dirty);
  const ba = $("#barra-avis");
  if (ba && !ba.classList.contains("ocult") && ba.dataset.tipus !== "info"){
    const fb = lameva();
    if (fb && doblesDe(fb).length === 0 && celesPendents(fb).length === 0) barraAvisNeteja();
  }
  /* v4.56: únic flux Desant → Desat → amagar — el botó (#btn-desa) i la
     franja (#barra-txt) es pinten SEMPRE junts des d'aquí, mai per separat,
     perquè no puguin quedar-se dient coses diferents (o contradictòries). */
  const bd = $("#btn-desa"), bt = $("#barra-txt");
  if (desant){
    if (bd){ bd.disabled = true; bd.textContent = "Desant…"; }
    if (bt) bt.textContent = "Desant…";
  } else if (dirty){
    // v4.50: mentre hi ha canvis pendents el botó és sempre actiu — encara que
    // just abans mostrés «✓ Desat» apagat (canvi nou després de desar)
    justDesat = false;
    if (bd){ bd.disabled = false; bd.textContent = "Desa els canvis"; }
    if (bt) bt.textContent = "Canvis sense desar";
  } else if (justDesat){
    if (bd){ bd.disabled = true; bd.textContent = "✓ Desat"; }
    if (bt) bt.textContent = "✓ Desat";
  }
  $("#barra").classList.toggle("amaga", !dirty && !desant && !justDesat);
}

function doblesDe(f){
  const out = [];
  (f.nens || []).forEach(n => DIES.forEach(d2 => {
    // una marca en una casella que el nen ja no té (pel curs) no compta: en desar s'esborra sola
    if (te(n.marca, "e8", d2) && te(n.marca, "e9", d2) && nenTeCasella(n, "e8", d2) && nenTeCasella(n, "e9", d2))
      out.push(n.nom.trim().split(/\s+/)[0] + " (" + DIES_NOM[d2] + ")");
  }));
  return out;
}
function barraAvis(html, tipus){ const b = $("#barra-avis"); if (!b) return; b.innerHTML = html; b.dataset.tipus = tipus || "valida"; b.classList.toggle("info", tipus === "info"); b.classList.remove("ocult"); }
function barraAvisNeteja(){ const b = $("#barra-avis"); if (b){ b.classList.add("ocult"); b.innerHTML = ""; } }
async function desa(){
  const fg = lameva();
  if (nomesTitular()) return;
  if (fg){
    const dobles = doblesDe(fg);
    if (dobles.length){
      barraAvis("\u26a0 <b>No es pot desar</b>: cada nen entra a les " + horaDe("e8") + " <b>o</b> a les " + horaDe("e9") + ", no a totes dues. Ho tenen doblat: " + esc(dobles.join(", ")) + ". Toca la marca que sobri per treure-la.");
      if (tabAct !== "graella") triaTab("graella");
      return;
    }
    /* v4.6: la setmana incompleta JA NO bloqueja el desat. Abans un canvi de
       curs que obria caselles noves ho deixava tot a l'ostatge (ni el curs nou
       ni les marques conservades no es podien desar, i en sortir es perdien).
       Ara es desa el que hi ha respost i l'avís — que s'apaga sol en
       completar — llista el que falta. Els Calendaris segueixen tancats fins
       que la setmana és completa (potCal), com sempre. */
    const pend = celesPendents(fg);
    // Marques que han quedat en caselles en blanc (p. ex. en canviar el curs):
    // en desar s'esborren; si hi havia un 🚗 amb nens a bord, avís de passatgers
    const caiguts = [];
    FRANGES.forEach(fr => DIES.forEach(dia => {
      if (estatCasella(fg, fr.id, dia) === "normal") return;
      if (!te(fg.cotxe, fr.id, dia)) return;
      ((fg.porta && fg.porta[fr.id + "-" + dia]) || []).forEach(r => {
        const ff = doc.families.find(x => x.id === r.fam);
        const nn = ff ? (ff.nens || []).find(x => x.id === r.nen) : null;
        if (nn && te(nn.marca, fr.id, dia)) caiguts.push(nn.nom);
      });
    }));
    if (pend.length){
      barraAvis("\u26a0 Falten <b>" + pend.length + "</b> caselles per respondre (\ud83d\ude97, \ud83d\ude4b o \ud83d\udeab; de les entrades " + horaDe("e8") + "/" + horaDe("e9") + " nom\u00e9s en cal una per nen). Primera: " + esc(pend[0]) + ". <b>Es desa igualment</b>; l'av\u00eds s'apagar\u00e0 sol quan la setmana sigui completa.");
      if (tabAct !== "graella") triaTab("graella");
    } else if (caiguts.length)
      barraAvis("\u2139\ufe0f " + esc(caiguts.join(" i ")) + " " + (caiguts.length === 1 ? "queda" : "queden") + " sense pla\u00e7a: aquella casella ara est\u00e0 en blanc pel vostre curs. Les seves fam\u00edlies ho veuran als Avisos.", "info");
    else barraAvisNeteja();
  }
  clearTimeout(timerJustDesat);
  desant = true; pintaBarra(); estat("Desant…");
  try {
    const f = lameva();
    // v4.46: cognoms de família canviats → reescriu els fills que en seguien el patró
    const cbOld = f.cognomsBase || { p: f.cognomPare || "", m: f.cognomMare || "" };
    const fillsCognomsActualitzats = ((f.cognomPare || "") !== cbOld.p || (f.cognomMare || "") !== cbOld.m)
      ? actualitzaCognomsFills(f, cbOld.p, cbOld.m) : false;
    /* v4.21: l'«abans» és el que hi havia CARREGAT a pantalla (portaBase),
       no una lectura en viu de la BD: un desat sense canvis reals no genera
       cap avís encara que la BD balli (desats a mitges, dos dispositius). */
    const abansRefs = [];
    Object.keys(f.portaBase || {}).forEach(cel => {
      const t2 = cel.split("-");
      (f.portaBase[cel] || []).forEach(r2 => abansRefs.push({ nen: r2.nen, slot: t2[0], day: t2[1] }));
    });
    /* v4.38 · CAS (b): un fill que es treu de la família (treuNen) pot deixar
       un conductor amb un seient orfe — l'esborrat en cascada de children →
       assignments és silenciós. Es detecta ABANS de desar, que és quan
       sbDesaFamilia esborrarà els fills que ja no siguin a f.nens. */
    let assigOrfes = [];
    {
      const rFillsAra = await sb.from("children").select("id,name").eq("family_id", f.id);
      const idsAra = new Set((f.nens || []).map(n => n.id));
      const fillsEsborrats = (rFillsAra.error ? [] : (rFillsAra.data || [])).filter(x => !idsAra.has(x.id));
      if (fillsEsborrats.length){
        const rAssigOrfes = await sb.from("assignments").select("*").in("child_id", fillsEsborrats.map(x => x.id));
        assigOrfes = (rAssigOrfes.error ? [] : (rAssigOrfes.data || [])).map(a => ({
          driverFamId: a.driver_family_id, slot: a.slot, day: a.day,
          childName: (fillsEsborrats.find(x => x.id === a.child_id) || {}).name || ""
        }));
      }
    }
    await sbDesaFamilia(f);
    await logActivitat("canvi graella", "Horari desat", f.id);
    /* v4.15: els canvis d'assignacions generen avisos A LA BD per a la família
       del nen. v4.36: revisat el circuit sencer — amb UN sol desat aquesta
       lògica (abans=portaBase, després=estat actual, dedup dins files2u) ja
       no insereix mai dues files idèntiques; els repetits venien d'una
       CURSA entre DOS desats independents gairebé simultanis (dos
       dispositius de la mateixa família). Això cap client tot sol no ho pot
       evitar: el tanca la finestra ampliada del trigger antiduplicats a la
       BD (SQL v49, 60 s en lloc de 2 s del v47; SQL v50 neteja els que ja
       hi havia). v4.38 · CAS (a): a més del nen, ara també avisa el
       conductor que se n'ha fet enrere (confirmació, un avís per viatge). */
    {
      const clauA = x => x.nen + "|" + x.slot + "|" + x.day;
      const despres = [];
      FRANGES.forEach(fr => DIES.forEach(dia => {
        if (!te(f.cotxe, fr.id, dia) || estatCasella(f, fr.id, dia) !== "normal") return;
        portaValids(f, fr.id, dia).forEach(r2 => despres.push({ nen: r2.nen, slot: fr.id, day: dia }));
      }));
      const setAbans = new Set(abansRefs.map(clauA)), setDespres = new Set(despres.map(clauA));
      const filesAv = [];
      despres.filter(x => !setAbans.has(clauA(x))).forEach(x => filesAv.push({ x: x, puja: true }));
      abansRefs.filter(x => !setDespres.has(clauA(x))).forEach(x => filesAv.push({ x: x, puja: false }));
      const files2 = [];
      const dropsPerCel = {};   // recompte de nens deixats per viatge, per a la confirmació al conductor
      filesAv.forEach(c => {
        let famN = null, nomNen = "";
        doc.families.forEach(ff => { const n2 = (ff.nens || []).find(z => z.id === c.x.nen); if (n2){ famN = ff; nomNen = n2.nom.trim().split(/\s+/)[0]; } });
        if (!famN || famN.id === f.id) return;   // els fills propis no reben avís del cotxe de casa
        const fr2 = FRANGES.find(z => z.id === c.x.slot);
        const quan = DIES_NOM[c.x.day] + " " + (fr2 ? fr2.hora : c.x.slot);
        if (c.puja){
          files2.push({ family_id: famN.id, family_name: famN.nom, child_name: nomNen,
            action: "\ud83d\ude97 puja al cotxe", detail: quan + " \u2192 el porta " + nomConductorComplet(f), actor_name: f.nom,
            message: "\ud83d\ude97 " + nomNen + " \u00b7 " + quan + " \u2192 el porta " + nomConductorComplet(f) });
        } else {
          const msg = nomNen + " s'ha quedat sense cotxe al viatge " + quan + ": " + nomConductorComplet(f) + " ja no el porta. Cal buscar-li pla\u00e7a.";
          files2.push({ family_id: famN.id, family_name: famN.nom, child_name: nomNen,
            action: "\u23f3 es queda sense cotxe", detail: msg, actor_name: f.nom, message: msg });
          const kCel = c.x.slot + "|" + c.x.day;
          dropsPerCel[kCel] = (dropsPerCel[kCel] || 0) + 1;
        }
      });
      Object.keys(dropsPerCel).forEach(kCel => {
        const t3 = kCel.split("|");
        const fr3 = FRANGES.find(z => z.id === t3[0]);
        const quan = DIES_NOM[t3[1]] + " " + (fr3 ? fr3.hora : t3[0]);
        const n3 = dropsPerCel[kCel];
        const msg = "Has deixat " + n3 + (n3 === 1 ? " nen" : " nens") + " sense cotxe al viatge " + quan + ". " + (n3 === 1 ? "Est\u00e0" : "Estan") + " buscant pla\u00e7a.";
        files2.push({ family_id: f.id, family_name: f.nom, child_name: "",
          action: "\u23f3 has deixat nens sense cotxe", detail: msg, actor_name: f.nom, message: msg });
      });
      /* v4.38 \u00b7 CAS (b): els conductors que portaven un fill acabat d'esborrar
         (assigOrfes, calculat abans de sbDesaFamilia) */
      assigOrfes.forEach(a => {
        const cDriver = doc.families.find(x => x.id === a.driverFamId);
        if (!cDriver || cDriver.id === f.id) return;
        const fr4 = FRANGES.find(z => z.id === a.slot);
        const quan = DIES_NOM[a.day] + " " + (fr4 ? fr4.hora : a.slot);
        const msg = a.childName + " ja no forma part de la fam\u00edlia " + f.nom + " i ha deixat el teu cotxe del viatge " + quan + ". Tens un seient m\u00e9s lliure.";
        files2.push({ family_id: cDriver.id, family_name: cDriver.nom, child_name: a.childName,
          action: "\u23f3 es queda sense cotxe", detail: msg, actor_name: f.nom, message: msg });
      });
      const vistK = new Set();
      const files2u = files2.filter(x => { const k = x.family_id + "|" + (x.child_name || "") + "|" + (x.action || "") + "|" + (x.detail || ""); if (vistK.has(k)) return false; vistK.add(k); return true; });
      if (files2u.length) await sb.from("notifications").insert(files2u);
    }
    // fills amb la graella esborrada: fora dels cotxes on estaven assignats + avís a tot el grup
    const resumEsborrats = [];
    for (const eb of esborratsPendents){
      let nAllib = 0; const nomsConds = [];
      doc.families.forEach(c => {
        if (c.id === f.id) return;
        const q = Object.values(c.porta || {}).reduce((t, arr) => t + (arr || []).filter(r => r.nen === eb.id).length, 0);
        if (q){ nAllib += q; nomsConds.push(nomConductorComplet(c)); }
      });
      const da = await sb.from("assignments").delete().eq("child_id", eb.id);
      if (da && da.error) avis("\u26a0 No s'han pogut alliberar les places de " + esc(eb.nom) + ": " + esc(msgNeta(da.error)));
      const msg = "La fam\u00edlia " + f.nom + " ha esborrat la graella de " + eb.nom + "." +
        (nomsConds.length ? " Les places que ocupava als cotxes de " + nomsConds.join(" i ") + " tornen a estar lliures." : "");
      await sb.from("notifications").insert(doc.families.map(ff => ({ family_id: ff.id, message: msg, family_name: f.nom, child_name: eb.nom, action: "\ud83d\uddd1\ufe0f graella esborrada", detail: msg, actor_name: f.nom })));
      await logActivitat("esborrat graella", "Graella de " + eb.nom + " esborrada", f.id);
      resumEsborrats.push("Graella de " + esc(eb.nom) + " esborrada." +
        (nAllib ? " " + nAllib + (nAllib === 1 ? " pla\u00e7a alliberada" : " places alliberades") + " als cotxes de " + nomsConds.map(esc).join(" i ") + "." : ""));
    }
    esborratsPendents = [];
    await sbGet();
    dirty = false; desant = false; justDesat = true;
    pintaBarra(); pintaPeuStats(); estat("Desat ✓", "ok");
    timerJustDesat = setTimeout(() => { justDesat = false; pintaBarra(); }, 2500);
    // v4.20: la pestanya oberta es repinta amb les dades desades — el mateix
    // repintat de sempre (pintaCotxe amb les seves barres, Resum…)
    if ($("#tab-cos")) triaTab(tabAct);
    if (resumEsborrats.length) avis("\ud83d\uddd1\ufe0f <b>" + resumEsborrats.join("<br>") + "</b>");
    else if (fillsCognomsActualitzats) avis("✓ <b>Cognoms actualitzats a la família i als fills</b> — els canvis ja són visibles per a tothom.", true);
    else avis("✓ <b>Desat</b> — els canvis ja són visibles per a tothom.", true);
  } catch(e){
    // v4.56: el botó torna a quedar actiu SEMPRE, encara que dirty sigui fals
    // (p. ex. un error de permisos en desar sense cap edició local pendent) —
    // per això aquí NO passem per pintaBarra() (que només el reactiva si hi
    // ha canvis), sinó que ho forcem directament perquè es pugui reintentar.
    desant = false;
    const bdErr = $("#btn-desa");
    if (bdErr){ bdErr.disabled = false; bdErr.textContent = "Desa els canvis"; }
    estat("No s'ha desat", true);
    $("#barra-txt").textContent = "No s'ha pogut desar: " + msgNeta(e) + ". Torna-ho a provar.";
    avis("No s'ha pogut desar. Torna-ho a provar.", "temp");
  }
}

function pintaPeuCredit(){
  const el = $("#peu-credit"); if (!el) return;
  el.innerHTML = "creat per V\u00edctor Quintana \u00b7 <span class='versio'>versi\u00f3 " + VERSIO + "</span>";
}
async function inici(){
  pintaPeuCredit();
  if (!sbOk()){
    estat("Sense configurar", true);
    $("#pantalla").innerHTML = "<div class='targeta'><h2>Falta la clau pública</h2><p class='lead'>Obre <b>index.html</b> i enganxa la <b>anon public key</b> del projecte Supabase al bloc CONFIG de dalt de tot del JavaScript (comença per <b>eyJ…</b>). La trobes a Supabase → Project Settings → API.</p></div>";
    return;
  }
  if (!window.supabase || !window.supabase.createClient){
    estat("Error", true);
    avis("No s'ha pogut carregar la llibreria de Supabase. Comprova la connexió a internet i recarrega la pàgina.");
    return;
  }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((ev) => {
    if (ev === "SIGNED_OUT"){ sessio = null; perfil = null; doc = null; famId = ""; esAdmin = esStaff = false; pantallaLogin(); }
  });
  estat("Connectant…");
  try {
    const r = await sb.auth.getSession();
    sessio = r.data && r.data.session ? r.data.session : null;
  } catch(e){ sessio = null; }
  if (!sessio){ pantallaLogin(); return; }
  await carregaPerfilIRuta();
}

async function carregaPerfilIRuta(){
  estat("Connectant…");
  let r = await sb.from("profiles").select("*").eq("id", sessio.user.id);
  if (r.error){ estat("Error", true); avis("No puc llegir el teu perfil. Recarrega la pàgina."); return; }
  if (!(r.data || []).length){
    const ins = await sb.from("profiles").insert({ id: sessio.user.id, email: sessio.user.email || "" });
    if (ins.error){ estat("Error", true); avis("No puc crear el teu perfil: " + esc(msgNeta(ins.error))); return; }
    perfil = { id: sessio.user.id, email: sessio.user.email || "", family_id: null, requested_group: null, status: "pendent", consent_at: null };
  } else {
    perfil = r.data[0];
  }
  if (!perfil.consent_at){ pantallaConsentiment(); return; }
  if (!perfil.family_id){ pantallaGrup(); return; }
  await entraApp();
}

async function entraApp(){
  try {
    await sbGet();
    const mevaFam = doc.families.find(x => x.id === perfil.family_id);
    esAdmin = !!(mevaFam && mevaFam.rol === "admin");
    esStaff = !!(mevaFam && mevaFam.rol === "staff");
    /* v4.26: si sóc titular o progenitor ho diu EL SERVIDOR — el_meu_perfil
       retorna es_titular (SQL v48). Si el servidor no ho pot dir, per
       defecte NOMÉS LECTURA: mai més un progenitor editant fins que la
       base de dades el bloqueja. L'admin queda com fins ara. */
    let esTitular = null;
    try {
      const prT = await sb.rpc("el_meu_perfil");
      if (!prT.error && prT.data && prT.data[0]){ perfil = prT.data[0]; esTitular = prT.data[0].es_titular; }
    } catch(e){}
    esProgenitor = !esAdmin && esTitular !== true;
    famId = (famId && lameva()) ? famId : perfil.family_id;
    estat("Connectat ✓", "ok");
    connectaRealtime();
    pantallaApp();
    return true;
  } catch(e){

async function buscaGrup(){
  const v = $("#gg-codi").value.trim().toUpperCase();
  // Una sola casella per als dos codis: la llargada decideix el camí
  if (v.length === 8){ await vinculaPerCodiFamilia(v); return; }   // codi de FAMÍLIA: un sol pas

  estat("Cercant…");
  const r = await sb.rpc("grup_per_codi", { p_code: v });
  estat("El teu grup");
  if (r.error){ avis("No puc cercar ara mateix. Torna-ho a provar."); return; }
  if (!(r.data || []).length){ avis("Cap grup actiu amb aquest codi. Revisa que l'hagis escrit bé."); return; }
  grupTrobat = r.data[0]; codiInvitacio = v;

async function vinculaPerCodiFamilia(codi){
  avis(""); estat("Vinculant…");
  sessio = (await sb.auth.getSession()).data.session || sessio;   // única font de veritat abans de l'RPC
  const r = await sb.rpc("claim_family_per_codi", { p_token: codi });
  if (r.error){
    const m = (r.error && r.error.message) || "";
    if (/ja té família|ja està vinculat/i.test(m)){
      const nomErr = (m.match(/vinculat a la família (.+)$/) || [])[1] || "";
      const correu = sessio && sessio.user ? sessio.user.email : "";
      if (await recuperaSiJaTeFamilia()){
        avis("El compte <b>" + esc(correu) + "</b> ja és de la família <b>" + esc(lameva() ? lameva().nom : nomErr) + "</b>. Un compte només pot ser d'una família. Perfil \u2192 \u00abDesvincula aquest compte\u00bb per canviar-ne.");
        return;
      }
    }
    estat("Error", true); avis(esc(msgNeta(r.error))); return;
  }
  const fila = (r.data || [])[0];
  const pr = await sb.rpc("el_meu_perfil");
  if (!pr.error && pr.data && pr.data[0]) perfil = pr.data[0];
  avis("Vinculat a la fam\u00edlia <b>" + esc(fila ? fila.nom : "") + "</b> \u2713", true);
  await entraApp();
}
async function creaGrup(){
  const nomG = $("#gg-nom") ? $("#gg-nom").value.trim() : "";
  if (!nomG){ avis("Posa-li un nom al grup (ex: EA 26/27)."); return; }
  const codiC = $("#gg-codicreacio") ? $("#gg-codicreacio").value.trim() : "";
  if (!codiC){ avis("Falta el <b>codi de creaci\u00f3 de grup</b>. Demana'l a l'administrador: V\u00edctor Quintana Andrev\u00ed (victorvqg@gmail.com)."); return; }
  const dades = llegeixFormFam(); if (!dades) return;
  avis(""); estat("Creant el grup…");
  // el codi NO és a l'app: el comprova create_group() contra app_config (SQL v41)
  const r = await sb.rpc("create_group", { p_name: nomG, p_cognom1: dades.cpare, p_cognom2: dades.cmare, p_driver: dades.cond, p_seats: dades.places, p_codi: codiC });
  if (r.error){ estat("Error", true); avis("No s'ha pogut crear el grup: " + esc(msgNeta(r.error))); return; }
  const pr = await sb.from("profiles").select("*").eq("id", sessio.user.id);
  if (pr.data && pr.data[0]) perfil = pr.data[0];
  try { await insereixNens(perfil.family_id, dades.nens); }
  catch(e){ avis("El grup s'ha creat però no s'han pogut afegir els nens: afegeix-los des del Perfil."); }
  await desaTelCurs(perfil.family_id, dades);
  await entraApp();
}
function llegeixFormFam(){
  const cpare = $("#nf-cpare") ? $("#nf-cpare").value.trim() : "";
  const cmare = $("#nf-cmare") ? $("#nf-cmare").value.trim() : "";
  const nom = (cpare + " " + cmare).trim();
  const cond = $("#nf-cond") ? $("#nf-cond").value.trim() : "";
  const tel = $("#nf-tel") ? $("#nf-tel").value.trim() : "";
  const nens = nfNens.map(x => ({ nom: (x.nom || "").trim(), curs: x.curs || "" })).filter(x => x.nom);
  if (!cpare){ avis("Posa el primer cognom de la família."); return null; }
  if (!nens.length){ avis("Afegeix com a mínim un nen."); return null; }
  return { cpare: cpare, cmare: cmare, nom: nom, cond: cond, places: nfPl, nens: nens, tel: tel };
}
async function desaTelCurs(famIdDest, dades){
  // El telèfon viatja fora de les RPC: update normal (RLS: la pròpia família / admin).
  // El curs ja NO: és de cada nen i va dins de children.

}

  if (nomesTitular()) return;
  const socMembre = !!(perfil && perfil.family_id);
  if (socMembre && esStaff && !esAdmin){ avis("El rol de staff pot corregir famílies, però no crear-ne."); return; }
  if (socMembre && !esAdmin){ avis("Aquest compte ja té una família: hi entrem directament."); await entraApp(); return; }
  const dades = llegeixFormFam(); if (!dades) return;
  if (dades.nens.length > 5){ avis("Màxim 5 fills per família."); return; }
  if (socMembre && esAdmin){
    // L'admin crea una família per a altres (sense compte vinculat)
    if (doc.families.length >= 100){ avis("Aquest grup ja ha arribat al màxim de 100 famílies."); return; }
    if (doc.families.some(x => slug(x.nom) === slug(dades.nom))){
      avis("Ja existeix una família que es diu «" + dades.nom + "». Si de debò és una família diferent, canvia-li una mica el nom.");
      return;
    }
    avis(""); estat("Creant la família…");
    const ins = await sb.from("families").insert({
      group_id: grupActiu.id, cognom1: dades.cpare, cognom2: dades.cmare,
      name: dades.nom, driver: dades.cond, seats: dades.places, role: "usuari",
      phone: dades.tel || ""
    }).select("id");
    if (ins.error){ estat("Error", true); avis("No s'ha pogut crear la família: " + esc(msgNeta(ins.error))); return; }
    const nouId = ins.data[0].id;
    try { await insereixNens(nouId, dades.nens); }
    catch(e){ avis("La família s'ha creat però no s'han pogut afegir els nens: afegeix-los des del seu Perfil."); }
    await logActivitat("alta família", dades.nom, nouId);
    await sbGet(); famId = nouId; estat("Desat ✓", "ok"); pantallaApp();
    return;
  }
  // Compte nou que s'uneix al grup amb codi d'invitació.
  // Alta ATÒMICA: els nens viatgen DINS de join_group_crea (una sola transacció):
  // si falla res, no queda cap perfil vinculat a mitges.
  avis(""); estat("Creant la família…");
  sessio = (await sb.auth.getSession()).data.session || sessio;   // única font de veritat abans de l'RPC
  const r = await sb.rpc("join_group_crea", { p_code: codiInvitacio, p_cognom1: dades.cpare, p_cognom2: dades.cmare, p_driver: dades.cond, p_seats: dades.places,
    p_nens: dades.nens.map(n => ({ nom: typeof n === "string" ? n : n.nom, curs: typeof n === "string" ? "" : (n.curs || "") })) });
  if (r.error){
    if (/ja té família|ja està vinculat/i.test((r.error && r.error.message) || "") && await recuperaSiJaTeFamilia()) return;
    estat("Error", true); avis("No s'ha pogut crear la família: " + esc(msgNeta(r.error))); return;
  }
  const pr = await sb.rpc("el_meu_perfil");
  if (!pr.error && pr.data && pr.data[0]) perfil = pr.data[0];
  await desaTelCurs(perfil.family_id, dades);
  await entraApp();
}

async function entraSel(){

    if (esStaff && !esAdmin && doc.adminFam && v === doc.adminFam){ avis("La família de l'administrador només la gestiona l'administrador.", "temp"); return; }

  if (!codiF){ avis("Escriu el codi de la família: t'l'ha de passar algú d'aquella família (el veu al seu Perfil)."); return; }
  avis(""); estat("Vinculant…");
  // Única font de veritat de la sessió abans de l'RPC de vinculació
  sessio = (await sb.auth.getSession()).data.session || sessio;

    console.log("[vincula] sessio.user.id =", sessio && sessio.user && sessio.user.id,

      "· email =", gu.data && gu.data.user && gu.data.user.email);
  } catch(e){}

/* Normalitza un mòbil per a wa.me: sense símbols i amb prefix de país. */
function telWa(t){
  let n = String(t || "").replace(/[^0-9+]/g, "");
  if (n.indexOf("+") === 0) n = n.slice(1);
  if (n.indexOf("00") === 0) n = n.slice(2);
  if (/^[6789]\d{8}$/.test(n)) n = "34" + n;   // mòbil espanyol escrit sense prefix
  return n;
}
/* Com va cada família: sense marcar / a mitges / completa (mateix criteri que el Resum). */
function estatFamilia(x){
  let teRes = false;
  FRANGES.forEach(fr => DIES.forEach(d => {
    if (estatCasella(x, fr.id, d) !== "normal") return;
    if (te(x.cotxe, fr.id, d) || te(x.propi, fr.id, d)) teRes = true;
    (x.nens || []).forEach(n => { if (te(n.marca, fr.id, d)) teRes = true; });
  }));
  if (!teRes) return { cls: "def", txt: "\u23f3 sense marcar" };
  if (!perfilComplet(x)) return { cls: "just", txt: "\u26a0 perfil incomplet" };
  if (!graellaCompleta(x)) return { cls: "just", txt: "\u26a0 graella a mitges" };
  return { cls: "ok", txt: "\u2713 completa" };
}

/* v4.7: esborra la graella d'UN fill. Els seus \ud83d\ude4b cauen a tot arreu i, a les
   caselles que NOMÉS té ell (cap germà les té), també el \ud83d\ude97/\ud83d\udeab de la família
   i els nens que hi portàveu. A les caselles compartides amb germans el \ud83d\ude97/\ud83d\udeab
   es queda: és la resposta de tota la família i els germans encara la fan
   servir. En memòria: cal «Desa els canvis», i es pot desfer sense desar. */
function esborraGraellaNen(id){
  const f = lameva(); if (!f) return;
  if (nomesTitular()) return;
  const n = f.nens.find(x => x.id === id); if (!n) return;
  const nomC = n.nom.trim().split(/\s+/)[0];
  const germans = (f.nens || []).filter(x => x.id !== n.id);
  /* buida la graella del fill. ambCompartides=false: el 🚗/🚫 de caselles que
     comparteix amb germans es queda (només cau el que és exclusivament seu). */
  const buida = (ambCompartides) => {
    FRANGES.forEach(fr => DIES.forEach(d => {
      treu(n.marca, fr.id, d);
      const compartida = germans.some(x => nenTeCasella(x, fr.id, d));
      if (!nenTeCasella(n, fr.id, d) && compartida) return;   // casella viva NOMÉS del germà: mai no es toca
      if (!ambCompartides && compartida) return;              // «només el que és seu»
      treu(f.cotxe, fr.id, d); treu(f.propi, fr.id, d);
      if (f.porta) delete f.porta[fr.id + "-" + d];
    }));
    if (!esborratsPendents.some(x => x.id === n.id)) esborratsPendents.push({ id: n.id, nom: nomC });
    dirty = true; pintaBarra();
    if (tabAct === "graella") pintaGraellaTab(); else pintaHorariComplet();
    avis("\ud83d\uddd1\ufe0f <b>Graella de " + esc(nomC) + " buida.</b> Prem \u00abDesa els canvis\u00bb per confirmar-ho.", true);
  };
  const teCompartidesMarcades = germans.length && FRANGES.some(fr => DIES.some(d =>
    (te(f.cotxe, fr.id, d) || te(f.propi, fr.id, d)) &&
    nenTeCasella(n, fr.id, d) && germans.some(x => nenTeCasella(x, fr.id, d))));
  if (teCompartidesMarcades){
    const nomsG = germans.map(x => x.nom.trim().split(/\s+/)[0]).join(" i ");
    mostraConfirm({
      titol: "\ud83d\uddd1\ufe0f Esborrar la graella de " + esc(nomC) + "?",
      text: "Els \ud83d\ude4b de " + esc(nomC) + " s'esborren segur. Per\u00f2 <b>el \ud83d\ude97 i el \ud83d\udeab s\u00f3n de tota la fam\u00edlia</b>. Vols treure'ls tamb\u00e9? <b>Afectar\u00e0 la graella de " + esc(nomsG) + "</b>: les caselles compartides li quedaran per respondre de nou. Si " + esc(nomC) + " pujava al cotxe d'una altra fam\u00edlia, en desar en quedar\u00e0 fora i les places s'alliberaran. Despr\u00e9s cal pr\u00e9mer \u00abDesa els canvis\u00bb.",
      ok: "Treu-ho tot", ok2: "Nom\u00e9s el que \u00e9s seu", cancel: "Cancel\u00b7la",
      alOk: () => buida(true), alOk2: () => buida(false)
    });
  } else {
    mostraConfirm({
      titol: "\ud83d\uddd1\ufe0f Esborrar la graella de " + esc(nomC) + "?",
      text: "Es buidar\u00e0 <b>TOTA la graella de " + esc(nomC) + "</b>: \ud83d\ude97, \ud83d\ude4b i \ud83d\udeab, tamb\u00e9 les marques apagades." +
        " Si " + esc(nomC) + " pujava al cotxe d'una altra fam\u00edlia, en desar en quedar\u00e0 fora i les places s'alliberaran (tot el grup ho veur\u00e0 als Avisos). Despr\u00e9s cal pr\u00e9mer <b>\u00abDesa els canvis\u00bb</b>.",
      ok: "S\u00ed, buida-la", cancel: "Cancel\u00b7la",
      alOk: () => buida(true)
    });
  }
}

let celObert = null;
/* nenId és OPCIONAL: si ve, el menú és d'aquell fill (graella per fill);
   si no, és de tota la família (compatibilitat amb el codi i les proves velles). */
function obreCasella(slot, dia, nenId){
  const f = lameva();
  if (nomesTitular()) return;
  const nSel = (f && nenId) ? (f.nens || []).find(x => x.id === nenId) : null;
  /* v4.49: un fill sense aquesta casella (pel seu curs) ja NO bloqueja obrir el
     men\u00fa \u2014 \ud83d\ude97/\ud83d\udeab s\u00f3n de tota la fam\u00edlia i qualsevol fill hi ha de poder donar
     acc\u00e9s; pintaCasella() ja amaga el \ud83d\ude4b (nom\u00e9s seu) quan no li toca a ell. */
  if (f && !nSel){
    const ec = estatCasella(f, slot, dia);
    if (ec === "blanc-entrada"){
      const cs34 = [...cursosDe(f)].every(c => c === "3r ESO" || c === "4t ESO");
      avis(slot === "e9"
        ? (cs34 ? "Els de 3r i 4t entren sempre a les " + horaDe("e8") + "." : "Aquest dia tots els nens entren a les " + horaDe("e8") + ".")
        : "Els de 1r i 2n entren a les " + horaDe("e8") + " nom\u00e9s dimarts i dimecres; aquest dia s'entra a les " + horaDe("e9") + ".");
      return;
    }
    if (ec === "blanc-tarda"){ avis("Els de 3r i 4t no tenen escola " + DIES_NOM[dia].toLowerCase() + " a la tarda: aquesta casella queda en blanc."); return; }
  }
  celObert = { slot: slot, dia: dia, nenId: nenId || "" }; pintaCasella();
}
/* Sobre quins fills actua el 🙋 del menú obert: el del bloc que s'ha tocat,
   o tots els de la casella si el menú s'ha obert sense fill (mode família). */
function nensDelMenu(f, s, d){
  if (celObert && celObert.nenId){
    const n = (f.nens || []).find(x => x.id === celObert.nenId);
    return (n && nenTeCasella(n, s, d)) ? [n] : [];
  }
  return nensDeCasella(f, s, d);
}
function tancaCasella(){ celObert = null; const m = $("#cel-menu"), v = $("#cel-vel"); if (m) m.classList.remove("obert"); if (v) v.classList.remove("obert"); }
function pintaCasella(){
  if (!celObert) return;

  const fr = FRANGES.find(x => x.id === s) || {};
  const btn = (on, txt, ac) => "<button class='cbtn" + (on ? " on" : "") + "' onclick=\"celAccio('" + ac + "')\">" + txt + (on ? " <span class='cb-ok'>\u2713</span>" : "") + "</button>";
  let h = "<div class='cm-cap'><b>" + DIES_NOM[d] + " \u00b7 " + (fr.hora || "") + "</b><span class='cm-tip'>" + (fr.tipus || "") + "</span><button class='cm-x' onclick='tancaCasella()'>\u2715</button></div>";
  const nSel = celObert.nenId ? (f.nens || []).find(x => x.id === celObert.nenId) : null;
  const noAplicaFill = nSel && !nenTeCasella(nSel, s, d);
  h += btn(te(f.cotxe, s, d), "\ud83d\ude97 Condu\u00efm nosaltres \u2014 els nens v\u00e9nen amb nosaltres \u00b7 " + f.places + " " + (f.places === 1 ? "pla\u00e7a" : "places"), "cotxe");
  if (noAplicaFill){

    h += "<p class='hint' style='margin:6px 2px'>\ud83d\udc66 " + nomC + " " + ((s === "e8" || s === "e9") ? "no entra a les " + horaDe(s) + " " + DIES_NOM[d].toLowerCase() : "no t\u00e9 escola " + DIES_NOM[d].toLowerCase() + " a la tarda") + ": no cal marcar-lo.</p>";
  } else {

    const totsMarcats = nensCel.length > 0 && nensCel.every(n => te(n.marca, s, d));
    const etDemana = nensCel.length === 1 ? "\ud83d\ude4b " + esc(nensCel[0].nom.trim().split(/\s+/)[0]) + " demana pla\u00e7a"
      : nensCel.length < f.nens.length ? "\ud83d\ude4b " + esc(nensCel.map(n => n.nom.trim().split(/\s+/)[0]).join(" i ")) + " demanen pla\u00e7a"
      : "\ud83d\ude4b Els nens demanen pla\u00e7a";
    h += btn(totsMarcats, etDemana, "demana");
  }
  h += btn(te(f.propi, s, d), "\ud83d\udeab Anem pel nostre compte", "propi");
  h += "<button class='boto' style='width:100%;margin-top:10px' onclick='tancaCasella()'>Fet</button>";
  const m = $("#cel-menu"), v = $("#cel-vel");
  if (!m || !v) return;
  m.innerHTML = h; m.classList.add("obert"); v.classList.add("obert");

function celAccio(ac){
  if (!celObert) return;
  if (nomesTitular()) return;
  const s = celObert.slot, d = celObert.dia;
  if (ac === "demana"){
    const k = s + "-" + d + "|demana", ara = Date.now();
    if (ultimToc.k === k && ara - ultimToc.t < 350) return;
    ultimToc = { k: k, t: ara };
    const f = lameva(); if (!f) return;
    const nensCel = nensDelMenu(f, s, d);   // el fill del bloc tocat (o tots, en mode família)
    if (!nensCel.length) return;
    const cel = s + "-" + d;
    const portatsAbans = te(f.cotxe, s, d) ? portaValids(f, s, d).map(r => {
      const ff = doc.families.find(x => x.id === r.fam);
      const nn = ff && (ff.nens || []).find(x => x.id === r.nen);
      return nn ? nn.nom.trim().split(/\s+/)[0] : null;
    }).filter(Boolean) : [];
    const tots = nensCel.every(n => te(n.marca, s, d));
    if (tots){ nensCel.forEach(n => treu(n.marca, s, d)); }
    else {
      treu(f.propi, s, d);
      if (te(f.cotxe, s, d)){ treu(f.cotxe, s, d); if (f.porta) delete f.porta[cel]; }
      nensCel.forEach(n => {
        if (!te(n.marca, s, d)) commuta(n.marca, s, d);
        if (s === "e8") treu(n.marca, "e9", d); else if (s === "e9") treu(n.marca, "e8", d);
      });
    }
    netejaGermana(f, s, d);
    dirty = true; pintaBarra(); pintaGraella();
    if (portatsAbans.length && !te(f.cotxe, s, d)){
      const hhFr = (FRANGES.find(x => x.id === s) || {}).hora || "";
      barraAvis("\u2139\ufe0f Has tret el cotxe de " + DIES_NOM[d] + " " + hhFr + ": <b>" + esc(portatsAbans.join(" i ")) + "</b> es queden sense pla\u00e7a. Les seves fam\u00edlies ho veuran als Avisos quan desis.", "info");
    }
    pintaCasella();
    return;
  }
  triaPinzell(ac.indexOf("nen:") === 0 ? ac.slice(4) : ac);
  pinta(s, d);
  pintaCasella();
}
function netejaGermana(f, slot, dia){
  if (slot !== "e8" && slot !== "e9") return;
  if (cursosDe(f).size) return;   // amb cursos no hi ha tria 8/9: cada entrada és dels seus nens i no es toquen entre elles
  if (!respon(f, slot, dia)) return;
  const g = slot === "e8" ? "e9" : "e8";
  const celG = g + "-" + dia;
  let portats = [];
  if (te(f.cotxe, g, dia)){
    portats = portaValids(f, g, dia).map(r => {
      const ff = doc.families.find(x => x.id === r.fam);
      const nn = ff && (ff.nens || []).find(x => x.id === r.nen);
      return nn ? nn.nom.trim().split(/\s+/)[0] : null;
    }).filter(Boolean);
    treu(f.cotxe, g, dia);
    if (f.porta) delete f.porta[celG];
  }
  treu(f.propi, g, dia);
  f.nens.forEach(n => treu(n.marca, g, dia));
  if (portats.length){
    barraAvis("\u2139\ufe0f L'entrada ha passat a les " + horaDe(slot) + " i el cotxe de les " + horaDe(g) + " s'ha tret: <b>" + esc(portats.join(" i ")) + "</b> es queden sense pla\u00e7a. Les seves fam\u00edlies ho veuran als Avisos quan desis.", "info");
  }
}
/* Una graella per fill. Les DADES no canvien: el 🚗 i el 🚫 segueixen sent de
   la família (es veuen a tots els blocs) i el 🙋 de cada fill és el seu.
   Només canvia com es mostra. */
function blocGraellaNen(f, n){
  const pend = celesPendentsNen(f, n);
  const buida = nenGraellaBuida(f, n);
  const nomC = n.nom.trim().split(/\s+/)[0];
  let h = "<div class='gr-bloc'><div class='gr-cap'><span class='gr-nom'>\ud83d\udc66 " + esc(n.nom) + "</span>" +
    (n.curs ? "<span class='gr-curs'>" + esc(n.curs) + "</span>"
            : "<span class='gr-curs sensecurs'>\u26a0 sense curs</span>") +
    "<span class='mp " + (pend.length ? "def" : "ok") + "'>" +
    (pend.length ? "\u26a0 " + pend.length + (pend.length === 1 ? " pendent" : " pendents") : "\u2713 completa") + "</span></div>";
  if (buida)
    h += "<p class='hint' style='margin:0 2px 7px'>\ud83d\udc4b Comen\u00e7a aqu\u00ed: toca la primera casella (dilluns entrada) i tria \ud83d\ude97, \ud83d\ude4b o \ud83d\udeab.</p>";
  else if (pend.length)
    h += "<p class='hint' style='margin:0 2px 7px'>Falta respondre de <b>" + esc(nomC) + "</b>: " + esc(pend[0]) +
         (pend.length > 1 ? " i " + (pend.length - 1) + (pend.length === 2 ? " m\u00e9s" : " m\u00e9s") : "") + ".</p>";
  h += "<div class='graella'>";
  h += "<div></div>" + DIES.map(d => "<div class='g-dia'>" + DIES_LBL[d] + "</div>").join("");
  let suggeridaFeta = false;
  FRANGES.forEach((fr, i) => {
    if (i === 0 || FRANGES[i-1].tipus !== fr.tipus)
      h += "<div class='g-grup'>" + (fr.tipus === "Entrada" ? "🌅 Entrada" : "🎒 Recollida") + "</div>";
    h += "<div class='g-hora'>" + fr.hora + "</div>";
    DIES.forEach(d => {
      const noAplica = !nenTeCasella(n, fr.id, d) || estatCasella(f, fr.id, d) !== "normal";
      let cls = "", cont = "";
      // v4.49: el 🚗/🚫 és de tota la família — es veu (apagat) fins i tot si aquest fill no hi entra;
      // només el 🙋 és exclusiu del fill i, per tant, només compta si la casella SÍ és seva.
      if (te(f.cotxe, fr.id, d)){ cls = "cond"; cont = "<span class='c-ico'>🚗</span>"; }
      else if (te(f.propi, fr.id, d)){ cls = "propi"; cont = "<span class='c-ico'>🚫</span>"; }
      else if (!noAplica && te(n.marca, fr.id, d)){
        cls = "nec" + (elPorta(f.id, n.id, fr.id, d) ? " cobert" : "");
        cont = "<span class='c-ico'>🙋</span>";
      }
      // v4.50: a la targeta buida, ressalta suaument la primera casella pendent
      if (buida && !noAplica && !suggeridaFeta){ cls += " suggerida"; suggeridaFeta = true; }
      h += "<button class='cel " + cls + (noAplica ? " na" : "") + "' onclick=\"obreCasella('" + fr.id + "','" + d + "','" + n.id + "')\"" +
           " aria-label='" + esc(nomC) + " " + DIES_NOM[d] + " " + fr.hora + "'>" + cont + "</button>";
    });
  });
  h += "</div>";
  if (!esProgenitor)
    h += "<div class='fila' style='margin-top:9px;justify-content:flex-end'>" +

function pinta(slot, dia){
  const f = lameva(); if (!f) return;
  if (nomesTitular()) return;
  const k = slot + "-" + dia + "|" + pinzell, ara = Date.now();
  if (ultimToc.k === k && ara - ultimToc.t < 350) return; // escut anti-tocs dobles
  ultimToc = { k: k, t: ara };
  if (!f.propi) f.propi = {};
  const cel = slot + "-" + dia;
  const portatsAbans = te(f.cotxe, slot, dia) ? portaValids(f, slot, dia).map(r => {
    const ff = doc.families.find(x => x.id === r.fam);
    const nn = ff && (ff.nens || []).find(x => x.id === r.nen);
    return nn ? nn.nom.trim().split(/\s+/)[0] : null;
  }).filter(Boolean) : [];
  const meusPre = f.nens.filter(n => te(n.marca, slot, dia) && elPorta(f.id, n.id, slot, dia)).map(n => ({ id: n.id, nom: n.nom.trim().split(/\s+/)[0] }));
  if (pinzell === "esborra"){ treu(f.cotxe, slot, dia); treu(f.propi, slot, dia); f.nens.forEach(n => treu(n.marca, slot, dia)); if (f.porta) delete f.porta[cel]; }
  else if (pinzell === "cotxe"){ treu(f.propi, slot, dia); commuta(f.cotxe, slot, dia); if (te(f.cotxe, slot, dia)) f.nens.forEach(n => treu(n.marca, slot, dia)); else if (f.porta) delete f.porta[cel]; }
  else if (pinzell === "propi"){ treu(f.cotxe, slot, dia); f.nens.forEach(n => treu(n.marca, slot, dia)); commuta(f.propi, slot, dia); if (f.porta) delete f.porta[cel]; }
  else { const n = f.nens.find(x => x.id === pinzell); if (!n){ pinzell = "cotxe"; pintaGraellaTab(); return; } if (!nenTeCasella(n, slot, dia)){ avis(esc(n.nom.trim().split(/\s+/)[0]) + " no t\u00e9 aquesta casella: l'hora d'entrada la fixa el seu curs."); return; } treu(f.propi, slot, dia); if (te(f.cotxe, slot, dia)){ treu(f.cotxe, slot, dia); if (f.porta) delete f.porta[cel]; } commuta(n.marca, slot, dia); if (te(n.marca, slot, dia)){ if (slot === "e8") treu(n.marca, "e9", dia); else if (slot === "e9") treu(n.marca, "e8", dia); } }
  netejaGermana(f, slot, dia);
  dirty = true; pintaBarra(); pintaGraella();
  const hhFr = (FRANGES.find(x => x.id === slot) || {}).hora || "";
  const araCond = te(f.cotxe, slot, dia);
  if (portatsAbans.length && !araCond){
    barraAvis("\u2139\ufe0f Has tret el cotxe de " + DIES_NOM[dia] + " " + hhFr + ": <b>" + esc(portatsAbans.join(" i ")) + "</b> es queden sense pla\u00e7a. Les seves fam\u00edlies ho veuran als Avisos quan desis.", "info");
  } else {
    const meusAfectats = meusPre.filter(x => { const nn = f.nens.find(k => k.id === x.id); return !nn || !te(nn.marca, slot, dia) || araCond; });
    if (meusAfectats.length){
      barraAvis("\u2139\ufe0f " + esc(meusAfectats.map(x => x.nom).join(" i ")) + " ja no " + (meusAfectats.length === 1 ? "puja" : "pugen") + " al cotxe que tenien assignat (" + DIES_NOM[dia] + " " + hhFr + "). En desar, la pla\u00e7a quedar\u00e0 lliure i l'altra fam\u00edlia ho veur\u00e0 al calendari.", "info");
    }
  }
}

function copiaText(t, btn){
  const ok = () => { if (btn){ const abans = btn.textContent; btn.textContent = "\u2713 copiat"; setTimeout(() => { btn.textContent = abans; }, 1500); } };
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(ok).catch(() => fallbackCopia(t, ok)); }
  else fallbackCopia(t, ok);
}
function fallbackCopia(t, ok){
  const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch(e){}
  ta.remove(); ok();
}
function copiaCodiAmbAvis(c, btn){

/* Esborrat múltiple: la MATEIXA funció de Supabase, un compte rere l'altre */
async function esborraSeleccionatsDeDebo(correus){
  estat("Esborrant\u2026");
  const fets = [], errs = [];
  for (const c of correus){
    const r = await sb.rpc("esborra_compte", { p_correu: c });
    if (r.error) errs.push("\u2717 " + esc(c) + " \u2014 " + esc(msgNeta(r.error)));
    else fets.push("\u2713 " + esc(c) + (r.data && r.data.length > 1 ? " \u2014 " + r.data.slice(1).map(esc).join("; ") : ""));
  }
  estat(errs.length ? "Fet amb errors" : "Comptes esborrats", errs.length ? true : "ok");
  avis("\ud83d\uddd1\ufe0f <b>Esborrat m\u00faltiple</b> \u2014 qu\u00e8 s'ha fet:<br>" + fets.concat(errs).join("<br>"));
  await sbGet();
  mostraComptes();
}
async function copiaSeguretat(){
  if (!esAdmin || !doc) return;
  let logs = [];
  try {
    const r = await sb.from("activity_log").select("*").eq("group_id", grupActiu.id).order("created_at", { ascending: false }).limit(500);
    if (!r.error) logs = r.data || [];
  } catch(e){}
  const data = { grup: doc.grupNom || "", exportat: new Date().toISOString(), versio_app: VERSIO, families: doc.families, logs: logs };
  const txt = JSON.stringify(data, null, 2);
  try {
    const blob = new Blob([txt], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "copia-cotxes-" + slug(doc.grupNom || "grup") + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    avis("C\u00f2pia de seguretat descarregada \u2713", true);
  } catch(e){
    const w2 = window.open("", "_blank");
    if (w2 && w2.document){ w2.document.write("<pre>" + esc(txt) + "</pre>"); }
    else avis("No s'ha pogut descarregar el fitxer en aquest navegador.");
  }
}

/* ── Importador de dades antigues (dades.json de l'era GitHub) ── */
async function importaDades(){
  if (nomesTitular()) return;
  if (!esAdmin) return;
  const txt = $("#imp-json").value.trim();
  const box = $("#imp-estat");
  if (!txt){ box.innerHTML = "\u26a0 Enganxa primer el contingut de dades.json."; return; }
  let vell;
  try { vell = JSON.parse(txt); } catch(e){ box.innerHTML = "\u26a0 Aix\u00f2 no \u00e9s un JSON v\u00e0lid."; return; }
  if (!vell || !Array.isArray(vell.families) || !vell.families.length){ box.innerHTML = "\u26a0 No hi trobo cap fam\u00edlia (cal un objecte amb \u00abfamilies\u00bb)."; return; }
  if (doc.families.length && !confirm("Al grup ja hi ha " + doc.families.length + " fam\u00edlia(es). La importaci\u00f3 AFEGEIX les del fitxer sense esborrar les actuals. Continues?")) return;
  box.innerHTML = "Important…";
  try {
    const mapaFam = {}, mapaNen = {};
    let nF = 0, nN = 0, nM = 0;
    for (const fv of vell.families){
      let F = doc.families.find(x => slug(x.nom) === slug(fv.nom || ""));
      if (!F){
        const ins = await sb.from("families").insert({
          group_id: grupActiu.id,
          cognom1: fv.cognomPare || (fv.nom || "").split(" ")[0] || "Fam\u00edlia",
          cognom2: fv.cognomMare || "",
          name: fv.nom, driver: fv.conductor || "",
          seats: Math.min(6, Math.max(0, fv.places == null ? 3 : fv.places)),
          role: "usuari"
        }).select();
        if (ins.error) throw ins.error;
        F = { id: ins.data[0].id, nens: [] };
        nF++;
      }
      mapaFam[fv.id] = F.id;
      const existia = !!doc.families.find(x => x.id === F.id);
      for (const nv of (fv.nens || [])){
        const ja = existia && F.nens.find(x => slug(x.nom) === slug(nv.nom || ""));
        if (ja){ mapaNen[fv.id + "|" + nv.id] = ja.id; continue; }
        const insN = await sb.from("children").insert({ family_id: F.id, name: nv.nom }).select();
        if (insN.error) throw insN.error;
        mapaNen[fv.id + "|" + nv.id] = insN.data[0].id;
        nN++;
      }
      if (existia){
        // La família ja existia: es respecten les seves marques i assignacions actuals
        box.innerHTML = "Important… " + esc(fv.nom) + " (ja existia: respectada) \u2713";
        continue;
      }
      // Marques: cotxe → drive, propi → own, marca de cada nen → request agrupada per casella
      const files = [];
      FRANGES.forEach(fr => DIES.forEach(dia => {
        if (te(fv.cotxe, fr.id, dia)) files.push({ family_id: F.id, slot: fr.id, day: dia, type: "drive" });
        else if (te(fv.propi, fr.id, dia)) files.push({ family_id: F.id, slot: fr.id, day: dia, type: "own" });
        else {
          const idsNens = (fv.nens || []).filter(nv => te(nv.marca, fr.id, dia)).map(nv => mapaNen[fv.id + "|" + nv.id]).filter(Boolean);
          if (idsNens.length) files.push({ family_id: F.id, slot: fr.id, day: dia, type: "request", children_ids: idsNens });
        }
      }));
      await sb.from("weekly_marks").delete().eq("family_id", F.id);
      if (files.length){
        const im = await sb.from("weekly_marks").insert(files);
        if (im.error) throw im.error;
        nM += files.length;
      }
      box.innerHTML = "Important… " + esc(fv.nom) + " \u2713";
    }
    // Assignacions (porta): ara que totes les marques hi s\u00f3
    let nA = 0, rebutjades = 0;
    for (const fv of vell.families){
      const driverId = mapaFam[fv.id]; if (!driverId) continue;
      const celles = fv.porta || {};
      for (const cel of Object.keys(celles)){
        const t = cel.split("-");
        for (const ref of (celles[cel] || [])){
          const childUuid = mapaNen[ref.fam + "|" + ref.nen];
          if (!childUuid) continue;
          const ia = await sb.from("assignments").insert({
            group_id: grupActiu.id, driver_family_id: driverId,
            child_id: childUuid, slot: t[0], day: t[1]
          });
          if (ia.error) rebutjades++; else nA++;
        }
      }
    }
    await logActivitat("acci\u00f3 autom\u00e0tica", "Importaci\u00f3 dades antigues: " + nF + " fam\u00edlies noves, " + nN + " nens, " + nM + " marques, " + nA + " assignacions");
    await sbGet();
    box.innerHTML = "\u2713 Importaci\u00f3 acabada: <b>" + nF + "</b> fam\u00edlies noves, <b>" + nN + "</b> nens, <b>" + nM + "</b> marques, <b>" + nA + "</b> assignacions" +
      (rebutjades ? " · \u26a0 " + rebutjades + " assignacions rebutjades per la validaci\u00f3 (places plenes o marques inexistents)" : "") +
      ". Recarrega per veure-ho tot.";
  } catch(e){
    box.innerHTML = "\u26a0 Error a meitat de la importaci\u00f3: " + esc(msgNeta(e)) + ". El que s'havia importat fins aquell moment queda desat.";
  }
}

function renomFam(v){
  const f = lameva(); if (!f) return;
  const nom = v.trim();
  if (!nom || nom === f.nom){ pintaHorariComplet(); return; }
  f.nom = nom;
  dirty = true; pintaBarra(); pantallaApp();
}
function recomponNom(f){ const a = (f.cognomPare || "").trim(), b = (f.cognomMare || "").trim(); if (a || b) f.nom = (a + " " + b).trim(); }
/* v4.46: si els cognoms canvien, els fills que en seguien el patró (nom de
   pila + cognoms VELLS, sencers o només el 1r) passen a portar els nous.
   Els que tenien un cognom diferent escrit a mà no es toquen. */
function actualitzaCognomsFills(f, cognomPareAbans, cognomMareAbans){
  const oldCombinat = ((cognomPareAbans || "").trim() + " " + (cognomMareAbans || "").trim()).trim();
  const oldNomesPare = (cognomPareAbans || "").trim();
  const novCombinat = ((f.cognomPare || "").trim() + " " + (f.cognomMare || "").trim()).trim();
  const novNomesPare = (f.cognomPare || "").trim();
  let algunActualitzat = false;
  (f.nens || []).forEach(n => {
    const nom = (n.nom || "").trim(); if (!nom) return;
    const patrons = [[oldCombinat, novCombinat], [oldNomesPare, novNomesPare]];
    for (const [oldS, novS] of patrons){
      if (!oldS || !nom.endsWith(" " + oldS)) continue;
      const pila = nom.slice(0, nom.length - oldS.length - 1).trim();
      if (!pila) continue;
      n.nom = novS ? (pila + " " + novS) : pila;
      algunActualitzat = true;
      break;
    }
  });
  return algunActualitzat;
}
function renomCognomPare(v){ const f = lameva(); if (!f) return; if (nomesTitular()) return; const nou = v.trim(); if (nou === (f.cognomPare || "")) return; f.cognomPare = nou; recomponNom(f); dirty = true; pintaBarra(); pantallaApp(); }
function renomCognomMare(v){ const f = lameva(); if (!f) return; if (nomesTitular()) return; const nou = v.trim(); if (nou === (f.cognomMare || "")) return; f.cognomMare = nou; recomponNom(f); dirty = true; pintaBarra(); pantallaApp(); }

const AVISOS_PER_PAGINA = 15;
var avisosLlista = [];        // v4.36: nom\u00e9s la P\u00c0GINA actual (carregada per range al servidor)
var avisosPagina = 1;
var avisosTotalFiltrat = 0;
var avisosGrupSencer = false; // abast de la consulta: tot el grup (admin a casa seva) o la fam\u00edlia activa
/* v4.39: id d'avís «A.B.C» — A el grup, B la família (estables, es guarden a
   Supabase i mai es recalculen), C el número de l'avís dins la família (SQL
   v52). Si el SQL encara no s'ha executat, algun número no hi és i no es
   mostra res (l'app es queda com estava, sense id). */
function idAvis(r){
  const g = grupActiu && grupActiu.numero;
  const fam = (doc && doc.families || []).find(x => x.id === r.family_id);
  const b = fam && fam.numero;
  const c = r.numero;
  return (g && b && c) ? (g + "." + b + "." + c) : "";
}
function dataHoraAv(iso){ const x = new Date(iso); const p2 = n2 => String(n2).padStart(2, "0"); return p2(x.getDate()) + "/" + p2(x.getMonth() + 1) + "/" + x.getFullYear() + " " + p2(x.getHours()) + ":" + p2(x.getMinutes()) + ":" + p2(x.getSeconds()); }
function netejaCercaAv(s){ return String(s || "").replace(/[,()%]/g, " ").trim(); }
/* v4.36: el filtre (data i cerca) es demana AL SERVIDOR \u2014 mai es baixa tot
   per tallar-ho al client. La mateixa consulta serveix per paginar (amb
   range) i per descarregar el CSV sencer (sense range). */
function construeixQueryAvisos(){
  const f = lameva();
  let q = sb.from("notifications").select("*", { count: "exact" });
  if (!avisosGrupSencer && f) q = q.eq("family_id", f.id);
  const de = ($("#av-de") || {}).value || "", fins = ($("#av-a") || {}).value || "";
  if (de) q = q.gte("created_at", de + "T00:00:00");
  if (fins) q = q.lte("created_at", fins + "T23:59:59");
  const cerca = netejaCercaAv(($("#av-q") || {}).value || "");
  if (cerca) q = q.or(["family_name", "child_name", "action", "detail", "message"].map(c => c + ".ilike.%" + cerca + "%").join(","));
  return q.order("created_at", { ascending: false });
}
function paginacioAvisosHtml(pagina, totalPag){
  if (totalPag <= 1) return "";
  return "<div class='fila' style='justify-content:center;align-items:center;gap:10px;margin-top:10px'>" +
    "<button class='boto sec' id='av-ant' " + (pagina <= 1 ? "disabled" : "") + " onclick='avAnterior()'>\u2039 Anteriors</button>" +
    "<span class='hint'>P\u00e0gina " + pagina + " de " + totalPag + "</span>" +
    "<button class='boto sec' id='av-seg' " + (pagina >= totalPag ? "disabled" : "") + " onclick='avSeguent()'>Seg\u00fcents \u203a</button></div>";
}
function pintaAvisosLlista(){
  const el = $("#avisos-llista"); if (!el) return;
  const totalPag = Math.max(1, Math.ceil(avisosTotalFiltrat / AVISOS_PER_PAGINA));
  el.innerHTML = (avisosLlista.length ? avisosLlista.map(r =>
    "<details class='conf fam-det'><summary>" + (idAvis(r) ? "<b>" + esc(idAvis(r)) + "</b> \u00b7 " : "") + dataHoraAv(r.created_at) +
      (r.family_name ? " \u00b7 " + esc(r.family_name) : "") +
      (r.child_name ? " \u00b7 " + esc(r.child_name) : "") +
      " \u00b7 " + esc(r.action || r.message || "") + "</summary>" +
    "<div style='padding:4px 2px 8px'><div class='f-linia'>" + esc(r.detail || r.message || "") + "</div>" +
    (r.actor_name ? "<div class='hint'>Qui ho ha fet: " + esc(r.actor_name) + "</div>" : "") +
    "</div></details>").join("")
    : "<p class='hint'>Cap av\u00eds amb aquest filtre.</p>") +
    paginacioAvisosHtml(avisosPagina, totalPag);
}
async function carregaAvisosPagina(pagina){
  avisosPagina = Math.max(1, pagina);
  const de2 = (avisosPagina - 1) * AVISOS_PER_PAGINA;
  const r = await construeixQueryAvisos().range(de2, de2 + AVISOS_PER_PAGINA - 1);
  avisosLlista = r.error ? [] : (r.data || []);
  avisosTotalFiltrat = r.error ? 0 : (r.count || 0);
  pintaAvisosLlista();
}
function avFiltra(){ return carregaAvisosPagina(1); }
function avNeteja(){ ["av-de", "av-a", "av-q"].forEach(id => { const e = $("#" + id); if (e) e.value = ""; }); return carregaAvisosPagina(1); }
async function avAnterior(){
  if (avisosPagina <= 1) return;
  await carregaAvisosPagina(avisosPagina - 1);
  try { $("#avisos-llista").scrollIntoView({ block: "start" }); } catch(e){}
}
async function avSeguent(){
  const totalPag = Math.max(1, Math.ceil(avisosTotalFiltrat / AVISOS_PER_PAGINA));
  if (avisosPagina >= totalPag) return;
  await carregaAvisosPagina(avisosPagina + 1);
  try { $("#avisos-llista").scrollIntoView({ block: "start" }); } catch(e){}
}
/* v4.36: la desc\u00e0rrega baixa TOT el resultat filtrat (no nom\u00e9s la p\u00e0gina
   visible) \u2014 la mateixa consulta filtrada, sense range. */
async function avisosCsv(){
  const camp = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const r = await construeixQueryAvisos().limit(5000);
  const files = r.error ? [] : (r.data || []);
  return "\uFEFF" + ["id", "grup", "fam\u00edlia (n\u00famero)", "av\u00eds (n\u00famero)", "data i hora", "fam\u00edlia", "nen", "canvi", "detall", "qui ho ha fet"].map(camp).join(",") + "\n" +
    files.map(row => { const fam = (doc && doc.families || []).find(x => x.id === row.family_id);
      return [idAvis(row), (grupActiu && grupActiu.numero) || "", (fam && fam.numero) || "", row.numero || "",

   segueixen sent vàlides amb el nou horari es queden; només cauen les de

  const f = lameva(); if (!f) return;

    treu(n.marca, fr.id, d);

  pintaBarra();

    const nomC = n.nom.trim().split(/\s+/)[0];

  }
  if (tabAct === "graella") pintaGraellaTab();

      pendTotals += cand.filter(n => !refs.some(r => r.fam === n.famId && r.nen === n.nenId)).length;
      const estatN = refs.length > meva.places ? "def" : refs.length === meva.places ? "just" : "ok";
      const lliures = Math.max(0, meva.places - refs.length);
      const badgeC = refs.length > meva.places
        ? "<span class='badge mal'>" + (refs.length - meva.places) + " de més</span>"
        : "<span class='badge be'>" + lliures + " " + (lliures === 1 ? "plaça lliure" : "places lliures") + "</span>";
      diaHtml += "<div style='margin-top:10px'>" + capFranjaHtml(fr, badgeC) + "</div>";
      if (cand.length){
        diaHtml += "<div class='assigna'><div class='a-cap'>Qui puges al teu cotxe? <span class='mp " + estatN + "'>" + refs.length + "/" + meva.places + "</span></div>" +
          cand.map(n => {
            const meu = refs.some(r => r.fam === n.famId && r.nen === n.nenId);
            const ff = doc.families.find(x => x.id === n.famId);
            const nn = ff ? (ff.nens || []).find(x => x.id === n.nenId) : null;
            const extra = (ff ? esc(ff.nom) : "") +
              (nn && nn.curs ? " · " + esc(nn.curs) : "") +
              (ff && ff.phone && ff.phoneVisible ? " · 📞 " + esc(ff.phone) : "");
            return "<label class='a-fila'><input type='checkbox' " + (meu ? "checked " : "") +
              "onchange=\"assigna('" + fr.id + "','" + d + "','" + n.famId + "','" + n.nenId + "', this.checked)\"> " +
              "<span>\ud83e\uddd2 <b>" + esc(n.nom) + "</b>" + (extra ? "<br><span class='a-sub'>" + extra + "</span>" : "") + "</span></label>";
          }).join("") + "</div>";
      } else {
        diaHtml += "<p class='hint' style='margin:2px 2px 0'>\ud83e\uddd2 Cap nen assignat (" + refs.length + "/" + meva.places + ").</p>";

}

function dibuixaCanvasHorari(fa){

    ctx.fillText(DIES_NOM[d], cx + (colW - 20) / 2, yCap - 21); ctx.textAlign = "left";
  });
  let y = yCap + 24;
  FRANGES.forEach((fr, r) => {
    const banda = BANDES.find(b => b.fr[0] === fr.id);
    if (banda){
      ctx.fillStyle = banda.cls === "ent" ? "#fdf1d9" : "#fbe4e0";
      rrCtx(ctx, x0, y, W - x0 * 2, grupH, 14); ctx.fill();
      ctx.fillStyle = banda.cls === "ent" ? "#8a5a12" : "#b3372c"; ctx.font = "800 28" + F;

        ctx.fillText("\u2014", cx + cw / 2, y + ch / 2); ctx.textAlign = "left"; return;
      }
      const p = palColors(c.pal);
      ctx.fillStyle = p[0]; ctx.strokeStyle = p[1]; ctx.lineWidth = 4;
      rrCtx(ctx, cx, y, cw, ch, 18); ctx.fill(); ctx.stroke();
      ctx.fillStyle = p[2]; rrCtx(ctx, cx, y, 13, ch, 6); ctx.fill();
      ctx.textAlign = "center"; const mx = cx + 10 + (cw - 10) / 2;

  ctx.textAlign = "center"; ctx.fillStyle = "#5E6E7A"; ctx.font = "700 25" + F;
  ctx.fillText(fa.llegenda.map(l => l[1]).join("   ·   "), W / 2, H - 86);

function canvasABlob(cv){
  return new Promise(res => {
    if (!cv) return res(null);
    try {
      if (cv.toBlob){ cv.toBlob(b => res(b || null), "image/jpeg", 0.92); return; }
      const u = cv.toDataURL("image/jpeg", 0.92);
      const bin = atob(u.split(",")[1]), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      res(new Blob([arr], { type: "image/jpeg" }));
    } catch(e){ res(null); }
  });
}
