        else if (te(nen.marca, fr.id, d)){
          const c = elPorta(famId2, nenId2, fr.id, d);
          txt = c ? "\ud83d\ude97 <b>el porta " + esc(nomConductor(c)) + "</b>"
                  : "<span class='a-pend'>\u23f3 pendent d'assignar</span>";
        } else if (te(fam.propi, fr.id, d)) txt = "\ud83d\udeab pel seu compte";
        if (txt) linies += "<div class='f-linia'><b style='width:56px;display:inline-block'>" + fr.hora + "</b> " + txt + "</div>";
      });
      if (linies) res += "<div class='targeta franja'><div class='f-cap'><span class='f-hora'>" + DIES_NOM[d] + "</span></div>" + linies + "</div>";
    });
    h += res || "<p class='lead'>Aquest nen no t\u00e9 cap trajecte marcat.</p>";
  }
  $("#cal-cos").innerHTML = h;
}
function selNenCanvia(v){ nenSel = v; pintaVistaNen(); }

/* v4.34: «Per assignar» per files — resum a dalt, una targeta per viatge
   amb pastilla (⚠ nens sense cotxe / ✓ resolt), una línia per persona i
   SENSE telèfons (són a Famílies). Les targetes amb nens esperant van
   primer (vora vermella, obertes); les resoltes a sota (vora verda,
   plegades); «Sense cotxe possible» al final. Tot surt de balanc() i
   portaValids(). */
function pintaPerAssignar(){
  const esperant = [], resolts = [], sense = [];
  DIES.forEach(d => FRANGES.forEach(fr => {
    const b = balanc(fr.id, d);
    if (!b.nens.length) return;
    const esperen = b.nens.filter(n => !n.portadaPerId);
    const lliures = b.conds.map(c => ({ c: c, n: Math.max(0, (c.places || 0) - portaValids(c, fr.id, d).length) })).filter(x => x.n > 0);
    const it = { d: d, fr: fr, esperen: esperen, coberts: b.nens.filter(n => n.portadaPerId), conds: lliures };
    if (!esperen.length) resolts.push(it);
    else if (lliures.length) esperant.push(it);
    else sense.push(it);
  }));
  const meva = lameva();
  const fitxa = (it, obert) => {
    const pastilla = it.esperen.length
      ? "<span class='badge mal'>\u26a0 " + it.esperen.length + (it.esperen.length === 1 ? " nen sense cotxe" : " nens sense cotxe") + "</span>"
      : "<span class='badge be'>\u2713 resolt</span>";
    let cos2 = "";
    if (it.esperen.length)
      cos2 += "<div class='f-linia'><b>\ud83d\ude4b Esperen pla\u00e7a</b></div>" +
        it.esperen.map(n => "<div class='f-linia' style='padding-left:14px'>" + esc(n.nom) + " \u00b7 " + esc(n.fam) + "</div>").join("");
    else if (it.coberts.length)
      cos2 += "<div class='f-linia'><b>\u2713 Tots amb cotxe</b></div>" +
        it.coberts.map(n => "<div class='f-linia' style='padding-left:14px'>" + esc(n.nom) + " \u00b7 " + esc(n.fam) + "</div>").join("");
    if (it.conds.length)
      cos2 += "<div class='f-linia' style='margin-top:4px'><b>\ud83d\ude97 Cotxes amb seients lliures</b></div>" +
        it.conds.map(x => "<div class='f-linia' style='padding-left:14px'>" + esc(x.c.nom) +
          (x.c.conductor ? " \u00b7 condueix " + esc(x.c.conductor) : "") +
          " \u00b7 " + x.n + (x.n === 1 ? " seient" : " seients") +
          (meva && x.c.id === meva.id ? " <button class='enllac' onclick=\"triaTab('cotxe')\">El teu cotxe \u2192</button>" : "") +
          "</div>").join("");
    return "<details class='targeta conf'" + (obert ? " open" : "") +
      " style='border-left:4px solid " + (it.esperen.length ? "#d64545" : "#2C7A4B") + ";margin-bottom:10px;margin-top:0'>" +
      "<summary><span class='f-cap' style='display:inline-flex;width:100%'><span class='f-hora'>" + DIES_LBL[it.d] + " " + it.fr.hora + "</span>" +
      "<span class='m-tip " + (it.fr.tipus === "Entrada" ? "e" : "r") + "'>" + it.fr.tipus + "</span>" + pastilla + "</span></summary>" +
      "<div style='padding:4px 2px 6px'>" + cos2 + "</div></details>";
  };
  const nProb = esperant.length + sense.length;
  const resum = nProb
    ? "<div class='targeta' style='border-left:4px solid #d64545'><b style='color:#8F2B1C'>\u26a0 " + nProb + (nProb === 1 ? " viatge" : " viatges") + " amb nens esperant</b></div>"
    : "<div class='targeta' style='border-left:4px solid #2C7A4B'><b style='color:#1F5C3B'>\u2713 Tots els nens tenen cotxe.</b></div>";
  $("#cal-cos").innerHTML = resum +
    esperant.map(it => fitxa(it, true)).join("") +
    resolts.map(it => fitxa(it, false)).join("") +
    (sense.length ? "<h2 style='margin:14px 2px 6px'>Sense cotxe possible</h2>" +
      "<p class='hint' style='margin:0 2px 8px'>Viatges amb nens esperant per\u00f2 cap seient lliure: per resoldre parlant.</p>" +
      sense.map(it => fitxa(it, true)).join("") : "");
}

/* \u2500\u2500 Pestanya: resum final del grup \u2500\u2500 */
async function pintaResum(){
  await refresca();
  if (!doc) return;
  const capResum = capFranjaHtml({ hora: FRANGES[0] ? FRANGES[0].hora : "7.35", tipus: FRANGES[0] ? FRANGES[0].tipus : "Entrada" }, "");
  /* v4.40: Resum torna a mostrar sempre l'estat de tot el grup — el filtre
     per nen (v4.29) es va traslladar del tot a la pestanya «Per nen», que
     ja tenia (i conserva) la seva pròpia variable nenSel. */
  const defs = [], justs = [], marges = [];
  let buides = 0, totPlaces = 0, totNens = 0;
  DIES.forEach(d => FRANGES.forEach(fr => {
    const b = balanc(fr.id, d);
    if (!b.conds.length && !b.nens.length){ buides++; return; }
    totPlaces += b.places; totNens += b.nens.length;
    const it = { d: d, fr: fr, b: b };
    if (b.diff < 0) defs.push(it);
    else if (b.diff === 0) justs.push(it);
    else marges.push(it);
  }));
  const pendents = doc.families.filter(f => {
    let teRes = false;
    FRANGES.forEach(fr => DIES.forEach(d => {
      if (estatCasella(f, fr.id, d) !== "normal") return;   // les caselles en blanc no demanen res
      if (te(f.cotxe, fr.id, d) || te(f.propi, fr.id, d)) teRes = true;
      (f.nens || []).forEach(n => { if (te(n.marca, fr.id, d)) teRes = true; });
    }));
    return !teRes;
  });
  const filaDet = (it, cls) => {
    const b = it.b;
    const txt = b.places + " " + (b.places === 1 ? "plaça" : "places") + " per a " + b.nens.length + " " + (b.nens.length === 1 ? "nen" : "nens");
    const pt = b.diff < 0 ? "−" + (-b.diff) : b.diff === 0 ? "0" : "+" + b.diff;
    const conds = b.conds.map(f => esc(f.nom) + " (" + (f.conductor ? esc(f.conductor) + " · " : "") + f.places + " " + (f.places === 1 ? "lliure" : "lliures") + ")").join(" · ");
    const noms = b.nens.map(n => esc(n.nom)).join(" · ");
    let det = "";
    if (conds) det += "<div>🚗 " + conds + "</div>";
    if (noms) det += "<div>🙋 " + noms + "</div>";
    det += "<button class='enllac' onclick=\"triaVistaCal('resum')\">obre el dia →</button>";
    return "<details class='r-det'><summary class='r-fila'><span class='r-dia'>" + DIES_NOM[it.d] + "</span>" +
           "<span class='r-hora'>" + it.fr.hora + "</span><span class='r-txt'>" + txt + "</span>" +
           "<span class='mp " + cls + "'>" + pt + "</span><span class='r-fletxa'>▾</span></summary>" +
           "<div class='r-nens'>" + det + "</div></details>";
  };
  const nNens = doc.families.reduce((s,f) => s + (f.nens || []).length, 0);
  let h = "<div class='targeta'><h2>L'estat del grup</h2><div class='r-stats'>" +
    "<div><b>" + doc.families.length + "</b><span>fam\u00edlies</span></div>" +
    "<div><b>" + nNens + "</b><span>nens</span></div>" +
    "<div><b>" + totPlaces + "</b><span>places ofertes/setm.</span></div>" +
    "<div><b>" + totNens + "</b><span>trajectes a cobrir</span></div></div>" +
    (pendents.length
      ? "<p class='lead' style='margin:10px 0 0'>\u23f3 Encara no han marcat res: <b>" + pendents.map(f => esc(f.nom)).join(", ") + "</b></p>"
      : "<p class='lead' style='margin:10px 0 0;color:#1F5C3B'><b>\u2713 Totes les fam\u00edlies han omplert l'horari.</b></p>") +
    "</div>";
  h += defs.length
    ? "<div class='targeta t-def'><h2 style='color:#8F2B1C'>\u2757 Falta cobrir</h2>" + defs.map(it => filaDet(it, "def")).join("") +
      "<p class='hint' style='margin:8px 2px 0'>Toca una l\u00ednia per veure els nens; \u00abobre el dia \u2192\u00bb per anar-hi.</p></div>"
    : "<div class='targeta t-ok'><h2 style='color:#1F5C3B'>\ud83c\udf89 Tot cobert</h2><p class='lead' style='margin:0'>Cap nen sense pla\u00e7a en tota la setmana.</p></div>";
  if (justs.length) h += "<div class='targeta t-just'><h2 style='color:#6E4E00'>Va just (sense marge)</h2>" + justs.map(it => filaDet(it, "just")).join("") + "</div>";
  if (marges.length) h += "<div class='targeta t-ok'><h2 style='color:#1F5C3B'>On sobren places</h2>" + marges.map(it => filaDet(it, "ok")).join("") + "<p class='hint' style='margin:8px 2px 0'>Toca una línia per veure els cotxes i les seves places.</p></div>";
  if (buides) h += "<p class='hint' style='text-align:center'>" + buides + " franges sense ning\u00fa apuntat.</p>";
  $("#cal-cos").innerHTML = h;
}
